<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Împărțire grupuri Facebook · salvează o inimă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --parchment:#FBF7EF; --paper:#fff; --ink:#2B2320; --muted:#8A7E70;
  --red:#C22B33; --red-deep:#9E1F27; --red-soft:#F7E5E4; --line:#EAE1D2;
  --amber:#B57C22; --amber-soft:#FBF0D9; --green:#3E7C4F; --green-soft:#E4EFE6;
  --blue:#39618E; --blue-soft:#E3EAF2; --violet:#6d4c8f; --violet-soft:#efe7f6;
  --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(43,35,32,.06),0 6px 20px rgba(43,35,32,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--parchment);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:70px}
.wrap{max-width:1060px;margin:0 auto;padding:22px 18px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* header */
header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.mark{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--red-deep));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;box-shadow:var(--shadow)}
.logo{height:52px;width:auto;flex:0 0 auto;object-fit:contain}
.drop{border:2px dashed #d9c9ae;border-radius:12px;background:#fffdf8;padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--red);background:var(--red-soft)}
.drop .dic{font-size:30px;line-height:1}
.drop .dtt{font-weight:700;font-size:14.5px;margin-top:6px}
.drop .dsub{font-size:12.5px;color:var(--muted);margin-top:3px}
@media(max-width:640px){.logo{height:42px}}
.mark svg{width:26px;height:26px}
h1{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.1;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:2px}
.hspace{flex:1}
.syncpill{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.syncpill .dot{width:9px;height:9px;border-radius:50%;background:#c9bfae}
.syncpill.on .dot{background:var(--green)}
.syncpill.on{color:var(--green)}

/* card / panels */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
select,input[type=text],textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
select{min-width:150px}
input[type=text]{min-width:180px}
textarea{width:100%;resize:vertical;min-height:52px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d8ccb8;background:#fefcf8}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-deep)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}

/* view tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{flex:1;min-width:110px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.stat b{font-family:var(--display);font-size:22px;font-weight:600;display:block;line-height:1}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat.g b{color:var(--green)} .stat.a b{color:var(--amber)} .stat.r b{color:var(--red)}
.progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:14px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5a9b6c);width:0}

/* person / segment blocks */
.block{margin-bottom:16px;overflow:hidden}
.block > h2{font-family:var(--display);font-weight:600;font-size:18px;padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.block .who{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;background:var(--blue)}
.who.c0{background:#39618E}.who.c1{background:#6d4c8f}.who.c2{background:#B57C22}.who.c3{background:#3E7C4F}.who.c4{background:#C22B33}.who.c5{background:#2b6b70}
.mini{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;text-align:right}
.seghdr{padding:10px 16px 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.seghdr .rec{color:var(--red);font-weight:700}
.batchline{padding:8px 16px;background:var(--amber-soft);border-bottom:1px solid var(--line);font-size:12.5px;color:#7a5716;font-weight:600;display:flex;align-items:center;gap:8px}

/* group rows */
.rows{list-style:none}
.row{display:flex;align-items:flex-start;gap:11px;padding:9px 16px;border-bottom:1px solid #f2ecdf}
.row:last-child{border-bottom:none}
.row.done{background:#fbfdf9}
.row.appr{background:var(--green-soft)}
.row.rej{background:#fdf2f2;opacity:.75}
.st{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.6px solid #cdbfa8;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px}
.st.p{background:var(--amber);border-color:var(--amber)}
.st.a{background:var(--green);border-color:var(--green)}
.row .body{flex:1;min-width:0}
.gname{font-weight:600;font-size:14.5px;word-break:break-word}
.row.appr .gname,.row.done .gname{color:#4a5b47}
.meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:3px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px}
.badge.pub{background:var(--green-soft);color:var(--green)}
.badge.priv{background:var(--red-soft);color:var(--red-deep)}
.badge.jud{background:var(--blue-soft);color:var(--blue)}
.mem{font-size:12px;color:var(--muted);font-weight:600}
.tagazi{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7a5716;background:var(--amber-soft);border:1px solid #ecd9ac;padding:1px 6px;border-radius:5px}
.tagpreluat{font-size:10px;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:1px 6px;border-radius:5px}
.rowbtns{display:flex;gap:5px;flex:0 0 auto;align-items:center}
.ib{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.ib:hover{border-color:#d8ccb8}
.ib.on{color:var(--amber);border-color:#e7cf9d;background:var(--amber-soft)}
.ib.fam.on{color:var(--red);border-color:#eec7c7;background:var(--red-soft)}
.ib.rej.on{color:var(--red);border-color:#eec7c7;background:var(--red-soft)}
.notewrap{margin-top:7px}
.notewrap textarea{min-height:38px;font-size:13px;background:#fffdf8}
.noteview{margin-top:5px;font-size:12.5px;color:#7a6a55;background:#fbf6ec;border-left:3px solid #e7d5b3;padding:5px 9px;border-radius:0 7px 7px 0;white-space:pre-wrap}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,35,32,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:16px;max-width:560px;width:100%;box-shadow:0 24px 60px rgba(43,35,32,.3)}
.modal h3{font-family:var(--display);font-weight:600;font-size:19px;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.modal .mbody{padding:16px 20px;max-height:64vh;overflow:auto}
.modal .mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:none;background:transparent;font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:8px}
.x:hover{background:var(--line)}
.help{font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.55}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--parchment);border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin:0 5px 6px 0}
.chip button{border:none;background:transparent;color:var(--muted);font-size:14px;line-height:1}
.memberrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f2ecdf}
.memberrow:last-child{border-bottom:none}
.memberrow .who{width:26px;height:26px;font-size:12px}
.memberrow .absinfo{font-size:12px;color:var(--red-deep);font-weight:600}
.tpl{background:var(--parchment);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.tpl h4{font-size:13px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.tpl .freq{font-size:11px;color:var(--red);font-weight:700}
.tpl pre{font-family:var(--body);font-size:12.5px;white-space:pre-wrap;color:#5a4e40;margin-top:6px;line-height:1.5}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.hidewrap{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.caznota{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;margin-bottom:14px;background:var(--amber-soft);border-color:#ecd9ac}
.caznota.nou{background:var(--red-soft);border-color:#e9b9b9;box-shadow:0 0 0 3px rgba(194,43,51,.12),var(--shadow);animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(194,43,51,.12),var(--shadow)}50%{box-shadow:0 0 0 8px rgba(194,43,51,.18),var(--shadow)}}
@media(prefers-reduced-motion:reduce){.caznota.nou{animation:none}}
.caznota .nou-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--red);color:#fff;padding:2px 7px;border-radius:5px;margin-left:7px;vertical-align:middle}
.bell{position:relative;border:1px solid var(--line);background:var(--paper);border-radius:999px;width:40px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow);flex:0 0 auto;margin-right:8px}
.bell:hover{border-color:#d8ccb8}
.bell.has{border-color:var(--red);background:var(--red-soft)}
.bell i{position:absolute;top:-5px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--parchment)}
.nlist{list-style:none}
.nlist li{padding:10px 0;border-bottom:1px solid #f2ecdf}
.nlist li:last-child{border-bottom:none}
.nlist .nh{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.nlist .nb{font-size:14px;color:#4a4036;white-space:pre-wrap;margin-top:3px}
.nlist li.unread .nh{color:var(--red)}
.caznota .pin{font-size:18px;line-height:1.2}
.caznota .ct{flex:1;min-width:0}
.caznota .ct b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#7a5716;display:block;margin-bottom:3px}
.caznota .nt{font-size:14px;color:#5a4a2a;white-space:pre-wrap;line-height:1.5}
.sw{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--green)} .sw.on::after{left:18px}
@media(max-width:640px){
  .row{flex-wrap:wrap}
  .rowbtns{width:100%;justify-content:flex-end}
  .mini{width:100%;text-align:left;margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="https://salveazaoinima.ro/uploads/_salveaza/config/5da06e72a355998af725c123/5dc98c542380f_logo.png" alt="Asociația salvează o inimă" onerror="this.style.display='none';var f=document.getElementById('markfb');if(f)f.style.display='flex';">
    <div class="mark" id="markfb" aria-hidden="true" style="display:none">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.35-7-9.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 7 4.5C19 15.65 12 20 12 20Z" fill="currentColor"/><path d="M5 12h3l1.5-3 2 5 1.5-2H19" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div class="eyebrow">Instrument intern · fundraising</div>
      <h1>Împărțire grupuri Facebook</h1>
      <div class="sub">Se împarte automat și echilibrat între colegi · fiecare bifează de la distanță ce a postat</div>
    </div>
    <div class="hspace"></div>
    <button class="bell" id="bell" onclick="openNotif()" title="Notificări de la colegi"><span>🔔</span><i id="bellcount" style="display:none">0</i></button>
    <button class="syncpill" id="syncpill" onclick="openSync()" style="display:none"><span class="dot"></span><span id="synctxt">Sincronizare</span></button>
  </header>

  <!-- CONTROL BAR -->
  <div class="card bar">
    <div class="field">
      <label>Caz activ</label>
      <div style="display:flex;gap:6px">
        <select id="cazSel" onchange="setCaz(this.value)"></select>
        <button class="btn sm" onclick="openCaz()" title="Adaugă, editează, notează sau șterge cazuri">✎ Cazuri</button>
      </div>
    </div>
    <div class="field" style="flex:1;min-width:200px">
      <label>Vezi</label>
      <div class="tabs" id="viewTabs">
        <button class="tab active" data-v="colegi" onclick="setView('colegi')">👥 Pe colegi</button>
        <button class="tab" data-v="segmente" onclick="setView('segmente')">🗂 Pe segmente</button>
        <button class="tab" data-v="judete" onclick="setView('judete')">📍 Pe județe</button>
        <button class="tab" data-v="familie" onclick="setView('familie')">👨‍👩‍👧 Familie</button>
      </div>
    </div>
    <div class="field">
      <label>Eu sunt</label>
      <select id="euSel" onchange="setEu(this.value)"></select>
    </div>
    <div class="field" id="persWrap">
      <label>Coleg</label>
      <select id="persSel" onchange="setPers(this.value)"></select>
    </div>
    <div class="field">
      <label>Caută grup</label>
      <input type="text" id="search" placeholder="nume grup..." oninput="render()">
    </div>
    <div class="field" style="justify-content:flex-end">
      <label>&nbsp;</label>
      <div style="display:flex;gap:6px">
        <button class="btn sm" onclick="openTeam()">👥 Echipă</button>
        <button class="btn red sm" onclick="openImport()" title="Încarcă un fișier Excel/CSV sau lipește o listă de grupuri noi">📥 Încarcă grupuri</button>
        <button class="btn sm" onclick="openTpl()">✉️ Mesaje</button>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="caznota"></div>
  <label class="hidewrap" style="margin-bottom:12px;cursor:pointer">
    <span class="sw" id="hidesw" onclick="toggleHide()"></span> Ascunde grupurile deja gata
  </label>

  <div id="list"></div>

  <div class="footer">Asociația „salvează o inimă" · salveazaoinima.ro — instrument intern de echipă</div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

/* ---- persistence: localStorage + Firebase ---- */
const LS='soi_grupuri_v1';
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const r=localStorage.getItem(LS); if(r) return JSON.parse(r); }catch(e){} return null; }

/* Firebase REST — aceeași bază ca Planificatorul; cheie separată soi-grupuri-v1 */
/* data locală (fus orar RO), nu UTC — altfel absențele se decalează cu o zi noaptea */
function todayLocal(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
let _syncWarnAt=0;
function syncWarn(){ const n=Date.now(); if(n-_syncWarnAt>30000){ _syncWarnAt=n; if(typeof toast==='function') toast('⚠ Nu s-a putut salva pe server — modificările sunt doar pe acest calculator. Verifică internetul.'); } }
/* Timp de SERVER: antetul HTTP „Date" al răspunsului = ceasul serverului. Aliniem
   timestamp-urile de merge la el, ca un PC cu ceasul greșit să nu-și piardă
   modificările la îmbinarea cu ale colegilor. */
let CLOCK_OFFSET=0;
function nowSrv(){ return Date.now()+CLOCK_OFFSET; }
function syncClock(r){ try{ const d=r&&r.headers&&r.headers.get&&r.headers.get('date'); if(!d)return; const st=Date.parse(d); if(isFinite(st)) CLOCK_OFFSET=st-Date.now(); }catch(e){} }
const FB = {
  url(){ return (S.sync.url||'').replace(/\/$/,''); },
  ok(){ const u=this.url(); return /^https:\/\/.+/.test(u) || u.indexOf('/api/')===0; },
  async put(slice,obj){ if(!this.ok())return false; obj._t=nowSrv();
    try{ const r=await fetch(this.url()+'/soi-grupuri-v1/'+slice+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}); syncClock(r); if(!r||!r.ok){ syncWarn(); return false; } return true; }catch(e){ syncWarn(); return false; } },
  async get(slice){ if(!this.ok())return null;
    try{ const r=await fetch(this.url()+'/soi-grupuri-v1/'+slice+'.json'); syncClock(r); if(!r||!r.ok)return null; return await r.json(); }catch(e){ return null; } }
};
let localT={config:0,note:0,stare:0};
/* union pe id, păstrând ordinea + valorile locale; elementele din tombstone nu revin */
function mergeCfgList(local, remote, delSet){
  const out=(local||[]).filter(x=>x&&!delSet.has(x.id));
  const seen=new Set(out.map(x=>x.id));
  (remote||[]).forEach(x=>{ if(x&&!seen.has(x.id)&&!delSet.has(x.id)){ out.push(x); seen.add(x.id); } });
  return out;
}
/* citește-îmbină-scrie: nu suprascrie grupurile/cazurile adăugate de un coleg între timp */
async function pushConfig(){
  localT.config=nowSrv();
  if(FB.ok()){
    const rem=await FB.get('config');
    if(rem&&rem._t){
      const gd=new Set([].concat(S.grupSterse||[], rem.grupSterse||[]));
      const cd=new Set([].concat(S.cazSterse||[], rem.cazSterse||[]));
      S.grupSterse=[...gd]; S.cazSterse=[...cd];
      S.grupuri=mergeCfgList(S.grupuri, rem.grupuri, gd);
      S.cazuri=mergeCfgList(S.cazuri, rem.cazuri, cd);
      (rem.echipa||[]).forEach(p=>{ if(S.echipa.indexOf(p)<0) S.echipa.push(p); });
      S.absente=Object.assign({}, rem.absente||{}, S.absente||{});
      S.handover=Object.assign({}, rem.handover||{}, S.handover||{});
      saveLocal();
    }
  }
  const ok=await FB.put('config',{grupuri:S.grupuri,cazuri:S.cazuri,echipa:S.echipa,absente:S.absente,handover:S.handover,grupSterse:S.grupSterse,cazSterse:S.cazSterse});
  localT.config=nowSrv();
  return ok;
}
async function pushNote(){
  localT.note=nowSrv();
  if(FB.ok()){
    const rem=await FB.get('note');
    if(rem&&rem.note){ S.note=Object.assign({}, rem.note, S.note); saveLocal(); } // local câștigă per cheie, păstrează notele colegilor pe alte grupuri
  }
  await FB.put('note',{note:S.note}); localT.note=nowSrv();
}
function pushStare(){ FB.put('stare',{stare:S.stare,stareT:S.stareT}); }

async function pull(){
  if(!FB.ok()) return;
  const cfg=await FB.get('config');
  if(cfg && cfg._t && cfg._t>localT.config){
    const vechi={}; S.cazuri.forEach(c=>vechi[c.id]=c.notaT||0);
    S.grupuri=cfg.grupuri||S.grupuri; S.cazuri=cfg.cazuri||S.cazuri; S.echipa=cfg.echipa||S.echipa; S.absente=cfg.absente||{}; S.handover=cfg.handover||{};
    S.grupSterse=cfg.grupSterse||S.grupSterse||[]; S.cazSterse=cfg.cazSterse||S.cazSterse||[]; localT.config=cfg._t;
    if(!S.cazuri.find(c=>c.id===S.cazActiv)) S.cazActiv=S.cazuri[0].id;
    // notă nouă de la un coleg → alertă
    S.cazuri.forEach(c=>{ const t=c.notaT||0; const autor=(c.notaDe||'').trim(), eu=(S.ui.eu||'').trim();
      if(t>(vechi[c.id]||0) && !(autor && eu && autor===eu)) alertaNota(c); });
  }
  const nt=await FB.get('note');
  if(nt && nt._t && nt._t>localT.note){ S.note=nt.note||{}; localT.note=nt._t; }
  const st=await FB.get('stare');
  if(st && st.stareT){ // merge per key by timestamp
    S.stareT=S.stareT||{};
    for(const k in st.stareT){ if((st.stareT[k]||0) > (S.stareT[k]||0)){
      const [caz,grup]=k.split('|'); S.stare[caz]=S.stare[caz]||{}; S.stare[caz][grup]=(st.stare[caz]||{})[grup]||''; S.stareT[k]=st.stareT[k];
    }}
  }
  saveLocal(); render(); renderChrome();
}

/* ============ ASSIGNMENT (deterministic) ============ */
function baseAssign(){
  // map grupId -> persoana din echipa completă, echilibrat pe segment + reach
  const team=S.echipa; const map={};
  if(!team.length) return map;
  SEGMENTE.concat(['__alt__']).forEach(seg=>{
    let gs=S.grupuri.filter(g=> seg==='__alt__' ? !SEGMENTE.includes(g.seg) : g.seg===seg);
    gs.sort((a,b)=> b.n-a.n || a.id.localeCompare(b.id));
    gs.forEach((g,i)=> map[g.id]=team[i%team.length]);
  });
  return map;
}
function isAbsent(pers){
  const a=S.absente[pers]; if(!a||!a.de||!a.pana) return false;
  const t=todayLocal();
  return a.de<=t && t<=a.pana;
}
function activeTeam(){ return S.echipa.filter(p=>!isAbsent(p)); }
let hashCache={};
function hashPick(str,arr){ let h=0; for(let i=0;i<str.length;i++) h=((h<<5)-h+str.charCodeAt(i))|0; return arr[Math.abs(h)%arr.length]; }

function effAssign(){
  const base=baseAssign(); const act=activeTeam(); const caz=S.cazActiv;
  const ho=S.handover[caz]||{}; const map={};
  S.grupuri.forEach(g=>{
    if(ho[g.id] && S.echipa.includes(ho[g.id])){ map[g.id]=ho[g.id]; return; }
    let p=base[g.id];
    if(!act.length){ map[g.id]=p; return; }
    if(p && isAbsent(p)) p=hashPick(g.id, act);   // redistribuie doar grupurile celui absent
    if(!p) p=hashPick(g.id, act);
    map[g.id]=p;
  });
  return map;
}

/* ============ STARE HELPERS ============ */
function stStatus(gid){ return (S.stare[S.cazActiv]||{})[gid]||''; }
function setStatus(gid,val){
  const caz=S.cazActiv; S.stare[caz]=S.stare[caz]||{};
  S.stare[caz][gid]= (S.stare[caz][gid]===val && val!=='') ? '' : val;
  S.stareT[caz+'|'+gid]=nowSrv();
  saveLocal(); pushStare(); render(); renderStats();
}
function cycleStatus(gid){ // ○ -> postat -> aprobat -> ○
  const cur=stStatus(gid);
  const next = cur==='' ? 'postat' : cur==='postat' ? 'aprobat' : '';
  const caz=S.cazActiv; S.stare[caz]=S.stare[caz]||{}; S.stare[caz][gid]=next; S.stareT[caz+'|'+gid]=nowSrv();
  saveLocal(); pushStare(); render(); renderStats();
}

function matchSearch(g){ const q=norm(document.getElementById('search').value); return !q || norm(g.name).includes(q); }

/* ultima postare a unui grup, peste TOATE cazurile (pentru cooldown anti-saturație) */
function ultimaPostareGrup(gid){ let m=0; for(const caz in S.stare){ const v=S.stare[caz]&&S.stare[caz][gid]; if(v==='postat'||v==='aprobat'){ const t=(S.stareT[caz+'|'+gid])||0; if(t>m)m=t; } } return m; }
function cooldownDays(seg){ const f=(FREQ[seg]||'').toLowerCase(); if(/zi(lnic)?/.test(f))return 1; const m=f.match(/(\d+)/); if(/s[ăa]pt/.test(f)){ const per=m?+m[1]:2; return Math.max(1,Math.round(7/Math.max(1,per))); } if(/lun/.test(f))return 14; return 3; }
function peCooldown(g){ const t=ultimaPostareGrup(g.id); if(!t)return false; return (nowSrv()-t) < cooldownDays(g.seg)*864e5; }
/* scor de prioritate pentru cazul activ: județ (0.40) + segment țintă (0.25) + reach log (0.25) − saturație (0.10) */
function prioScore(g){ const c=S.cazuri.find(x=>x.id===S.cazActiv)||{}; const local=(c.judet&&g.judet&&norm(g.judet)===norm(c.judet))?1:0; const seg=(Array.isArray(c.segmente)&&c.segmente.indexOf(g.seg)>=0)?1:0; const reach=Math.log10((+g.n||0)+1)/Math.log10(_nmax+1); const satur=peCooldown(g)?1:0; return 0.40*local+0.25*seg+0.25*reach-0.10*satur; }
function orderGroups(gs){ // de postat: după scorul de prioritate; apoi postat, aprobat, respins
  const rank={'':0,'postat':1,'aprobat':2,'respins':3};
  return gs.slice().sort((a,b)=>{ const ra=rank[stStatus(a.id)],rb=rank[stStatus(b.id)]; if(ra!==rb)return ra-rb; if(ra===0){ const d=prioScore(b)-prioScore(a); if(Math.abs(d)>1e-9)return d>0?1:-1; } return (b.n||0)-(a.n||0); });
}
function visible(gs){ return S.ui.hide ? gs.filter(g=>stStatus(g.id)==='' ) : gs; }

function renderColegi(host,groups){

function renderJudete(host,groups){
  const cazJud=(S.cazuri.find(c=>c.id===S.cazActiv)||{}).judet||'';
  const buckets={};
  groups.forEach(g=>{ const j=g.judet||'— Fără județ / Național'; (buckets[j]=buckets[j]||[]).push(g); });
  // sortare: caz-județ primul, apoi după nr grupuri desc, „fără județ" ultimul
  let keys=Object.keys(buckets).sort((a,b)=>{
    if(cazJud){ if(a===cazJud)return -1; if(b===cazJud)return 1; }
    const az=a.startsWith('—'),bz=b.startsWith('—'); if(az!==bz)return az?1:-1;
    return buckets[b].length-buckets[a].length;
  });
  let html='';
  if(cazJud) html=`<div class="card" style="padding:10px 14px;margin-bottom:12px;font-size:13px"><b>Caz local:</b> grupurile din <b>${esc(cazJud)}</b> apar primele. Adaugă grupuri locale cu butonul „📥 Încarcă grupuri" (li se detectează județul automat).</div>`;
  keys.forEach(j=>{
    let gs=orderGroups(buckets[j]); const shown=visible(gs);
    html+=`<div class="card block"><h2>${esc(j)} <span class="mini">${gs.length} grupuri</span></h2><ul class="rows">`;
    shown.forEach(g=> html+=groupRow(g));
    if(!shown.length) html+='<li class="empty">Toate gata aici.</li>';
    html+='</ul></div>';
  });
  host.innerHTML=html;
}

function notite(){ // toate notele existente, cele mai noi primele
  return S.cazuri.filter(c=>(c.nota||'').trim()).map(c=>({caz:c, t:c.notaT||0, de:c.notaDe||'', txt:c.nota.trim()}))

function eNecitita(c){
  if(!(c.nota||'').trim()) return false;
  const t=c.notaT||0; if(t<=0) return false;
  if((S.citit[c.id]||0) >= t) return false;
  const autor=(c.notaDe||'').trim(), eu=(S.ui.eu||'').trim();
  if(autor && eu && autor===eu) return false;   // doar autorul cunoscut e scutit
  return true;
}

/* sunet scurt + notificare de browser */
function beep(){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A)return; const c=new A();
  const o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination);
  o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(.0001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.45);
  o.start(); o.stop(c.currentTime+.5); }catch(e){} }
function alertaNota(c){

}

function fmtK(n){ n=+n||0; if(n>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M'; if(n>=1e3)return Math.round(n/1e3)+'K'; return ''+n; }
function renderStats(){
  const host=document.getElementById('stats');

  const total=S.grupuri.length;
  let postate=0,aprobate=0,respinse=0,reachLive=0,reachTot=0;

  const live=postate+aprobate;

  let h=`

  if(S.ui.pers!=='toti'){

    h+=`<div class="stat g"><b>${meleGata}/${mele.length}</b><span>Ale tale · ${esc(S.ui.pers)}<div class="progress"><i style="width:${mp}%"></i></div></span></div>`;

function dropFile(ev){
  ev.preventDefault(); const d=document.getElementById('drop'); if(d)d.classList.remove('over');

function addGroups(rows, seg){
  const existing=new Set(S.grupuri.map(g=>norm(g.name)));
  let added=0,dup=0;
  rows.forEach(r=>{
    let name=(r.name||'').trim(); if(!name) return;
    // sari peste antet
    if(/^(nume|grup|group|name)$/i.test(name)) return;
    const key=norm(name);
    if(existing.has(key)){ dup++; return; }
    existing.add(key);
    let tip=(r.tip||'').toUpperCase(); tip = tip.includes('PRIV')?'PRIVAT':'PUBLIC';
    let membri=(r.membri||'').toString().trim()||'—';
    let n=parseMembriJS(membri);
    S.grupuri.push({id:'imp'+Date.now()+'_'+added, name, tip, membri, n, seg, judet:detectJudet(name), familie:(tip==='PUBLIC'), url:(r.url||'').trim()});
    added++;
  });
  saveLocal(); pushConfig(); renderChrome(); render();
  const rep=document.getElementById('impReport');
  const msg=`✅ ${added} grupuri importate${dup?` · ${dup} duplicate ignorate`:''}. Total acum: ${S.grupuri.length}.`;
  if(rep) rep.innerHTML=msg; toast(msg.replace('✅ ',''));
}
function parseMembriJS(s){ s=(s||'').toString().toLowerCase().replace(/\s/g,'');
  if(s.includes('mil')) return Math.round(parseFloat(s.replace(/mil.*/,'').replace(',','.'))*1e6)||0;
  if(s.endsWith('k')) return Math.round(parseFloat(s.slice(0,-1).replace(',','.'))*1000)||0;
  return parseInt(s.replace(/[^0-9]/g,''))||0; }
function importText(){
  const seg=document.getElementById('impSeg').value;
  const rows=parseTextRows(document.getElementById('impText').value);
  if(!rows.length){ toast('Nu am găsit niciun grup în text.'); return; }
  addGroups(rows,seg);
}

/* ---- parser universal de text: linii libere, CSV/TSV, „nume | tip | membri", linkuri FB ---- */
function parseTextRows(txt){
  const out=[];
  (txt||'').split(/\r?\n/).forEach(raw=>{
    let l=raw.trim(); if(!l) return;
    if(/^(nume|grup|group|name|denumire)\b/i.test(l) && !/facebook\.com/i.test(l)) return; // antet
    // link pe rând separat -> atașează la ultimul grup fără link
    const soloLink=l.match(/^(https?:\/\/\S*facebook\.com\/\S+)$/i);
    if(soloLink){
      let att=false;
      for(let i=out.length-1;i>=0;i--){ if(!out[i].url){ out[i].url=soloLink[1]; att=true; break; } }
      if(!att){ const slug=decodeURIComponent((soloLink[1].split('/groups/')[1]||'').split(/[/?#]/)[0]||'').trim();
        if(slug) out.push({name:slug,tip:'',membri:'',url:soloLink[1]}); }
      return;
    }
    let url=''; const lm=l.match(/(https?:\/\/\S*facebook\.com\/\S+)/i);
    if(lm){ url=lm[1].replace(/[),;]+$/,''); l=l.replace(lm[0],' ').trim(); }
    // separator: | ; tab ; virgulă (dacă nu e parte din nume) 
    let parts = l.includes('|') ? l.split('|') : l.includes('\t') ? l.split('\t') : [l];
    parts=parts.map(x=>x.replace(/["\s]+$/,'').trim());
    // scoate numerotarea de listă DOAR din numele grupului (1. / 2) / - / •)
    parts[0]=(parts[0]||'').replace(/^\s*(?:\d{1,3}\s*[.)\]]|[-–—·•*])\s+/,'').replace(/^["'\s]+/,'').trim();
    let name=parts[0]||''; if(!name && !url) return;
    let tip='', membri='';
    parts.slice(1).forEach(p=>{
      if(/priv|public/i.test(p)) tip=p;
      else if(/\d/.test(p) && /^[\d.,\s]*(k|mil\.?|m)?$/i.test(p.trim())) membri=p;
    });
    if(!name && url) name=decodeURIComponent(url.split('/groups/')[1]||'').replace(/\/$/,'');
    if(!name) return;
    out.push({name,tip,membri,url});
  });
  return out;
}

function importFile(ev){ const f=ev.target.files[0]; if(f) readGroupsFile(f); }

/* ---- ORICE FORMAT: xlsx/xls/ods/csv/tsv, txt/md/json/html, docx, pdf ---- */
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
function readGroupsFile(f){
  const segEl=document.getElementById('impSeg'); const seg=segEl?segEl.value:SEGMENTE[0];
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  const rep=document.getElementById('impReport');
  if(rep) rep.innerHTML='⏳ Se citește <b>'+esc(f.name)+'</b>...';

  const fail=m=>{ if(rep) rep.innerHTML='⚠️ '+m; toast(m); };
  const done=rows=>{ if(!rows.length){ fail('Nu am găsit niciun grup în fișier.'); return; } addGroups(rows,seg); };

  // 1) foi de calcul
  if(['xlsx','xls','xlsm','ods','csv','tsv'].includes(ext)){
    const rd=new FileReader();
    rd.onload=e=>{ try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      let rows=[];
      wb.SheetNames.forEach(sn=>{
        XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1}).forEach(r=>{
          const cells=(r||[]).map(c=>(c==null?'':c).toString().trim());
          if(!cells.length) return;
          const name=cells.find(c=>c && !/^https?:/i.test(c)) || '';
          const url=(cells.find(c=>/facebook\.com\/groups/i.test(c))||'');
          const tip=(cells.find(c=>/^(public|privat|private)$/i.test(c))||'');
          const membri=(cells.slice(1).find(c=>/^\d[\d.,\s]*(k|mil\.?)?$/i.test(c))||'');
          if(name||url) rows.push({name,tip,membri,url});
        });
      });
      done(rows);
    }catch(err){ fail('Nu am putut citi foaia de calcul.'); } };
    rd.readAsBinaryString(f); return;
  }

  // 2) Word .docx
  if(ext==='docx'){
    const rd=new FileReader();
    rd.onload=async e=>{
      try{
        if(!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
        const res=await window.mammoth.convertToHtml({arrayBuffer:e.target.result});
        done(rowsFromHtml(res.value));
      }catch(err){ fail('Nu am putut citi documentul Word. Încearcă să copiezi textul și să-l lipești mai jos.'); }
    };
    rd.readAsArrayBuffer(f); return;
  }

  // 3) PDF
  if(ext==='pdf'){
    const rd=new FileReader();
    rd.onload=async e=>{
      try{
        if(!window.pdfjsLib){
          await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
          window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        const pdf=await window.pdfjsLib.getDocument({data:e.target.result}).promise;
        let rows=[];
        for(let p=1;p<=pdf.numPages;p++){
          const page=await pdf.getPage(p);
          // linkuri reale din PDF
          const ann=await page.getAnnotations();
          const links=ann.filter(a=>a.url&&/facebook\.com\/groups/i.test(a.url)).map(a=>a.url);
          const tc=await page.getTextContent();
          // reconstituie liniile după poziția pe verticală
          const byY={};
          tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (byY[y]=byY[y]||[]).push(it.str); });
          const lines=Object.keys(byY).sort((a,b)=>b-a).map(y=>byY[y].join(' ').replace(/\s+/g,' ').trim()).filter(Boolean);
          let pageRows=parseTextRows(lines.join('\n'));
          // atașează linkurile paginii, în ordine
          pageRows.forEach((r,i)=>{ if(!r.url && links[i]) r.url=links[i]; });
          rows=rows.concat(pageRows);
        }
        done(rows);
      }catch(err){ fail('Nu am putut citi PDF-ul. Încearcă să copiezi textul și să-l lipești mai jos.'); }
    };
    rd.readAsArrayBuffer(f); return;
  }

  // 4) text simplu: txt, md, json, html, orice altceva
  const rd=new FileReader();
  rd.onload=e=>{
    const t=e.target.result||'';
    try{
      if(ext==='json'){
        const j=JSON.parse(t); const arr=Array.isArray(j)?j:(j.grupuri||j.groups||j.items||[]);
        const rows=arr.map(o=> typeof o==='string' ? {name:o,tip:'',membri:'',url:''} :
          {name:(o.name||o.nume||o.grup||o.title||'').toString(),
           tip:(o.tip||o.type||'').toString(),
           membri:(o.membri||o.members||o.n||'').toString(),
           url:(o.url||o.link||o.href||'').toString()});
        done(rows); return;
      }
      if(ext==='html'||ext==='htm'){ done(rowsFromHtml(t)); return; }
      done(parseTextRows(t));
    }catch(err){ done(parseTextRows(t)); }
  };
  rd.readAsText(f,'UTF-8');
}
/* din HTML: ia ancorele către grupuri, altfel textul curat */
function rowsFromHtml(html){
  const d=document.createElement('div'); d.innerHTML=html;
  const rows=[];
  d.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href')||'';
    if(/facebook\.com\/groups/i.test(href)){
      const nm=(a.textContent||'').replace(/\s+/g,' ').trim();
      if(nm) rows.push({name:nm,tip:'',membri:'',url:href});
    }
  });
  if(rows.length) return rows;
  return parseTextRows((d.textContent||'').replace(/\n{2,}/g,'\n'));
}

/* ============ INIT ============ */
function init(){
  const saved=loadLocal();
  if(saved && saved.grupuri && saved.grupuri.length){ S=Object.assign(S,saved); }
  else { S.grupuri=buildSeed(); saveLocal(); }
  // asigură câmpuri
  S.stare=S.stare||{}; S.stareT=S.stareT||{}; S.note=S.note||{}; S.handover=S.handover||{}; S.absente=S.absente||{};
  S.ui=Object.assign({view:'colegi',pers:'toti',hide:false,eu:''},S.ui||{});
  S.citit=S.citit||{};
  // note vechi, fără marcaj de timp: le dăm unul, ca să poată fi semnalate
  S.cazuri.forEach(c=>{ if((c.nota||'').trim() && !c.notaT) c.notaT=nowSrv(); });
  if(!S.cazuri.find(c=>c.id===S.cazActiv)) S.cazActiv=S.cazuri[0].id;
  // migrare: completează linkurile grupurilor seed dacă lipsesc (stare veche salvată)
  const seedUrl={}; SEED.forEach(s=>seedUrl[s.id]=s.url);
  S.grupuri.forEach(g=>{ if((!g.url||!g.url.trim()) && seedUrl[g.id]) g.url=seedUrl[g.id]; });
  // sincronizare implicită (aceeași bază ca Planificatorul) — colegii nu configurează nimic
  S.sync={url:DEFAULT_SYNC}; saveLocal(); /* platforma gestionează sincronizarea; ignoră orice URL vechi */
  renderChrome(); render();
  try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
  if(FB.ok()){ pull(); setInterval(pull, 10000); }
}
init();

<script>
/* Identitate din login: mapează numele logat la persoana din echipă și fixează „Eu sunt". */
(function(){
  var TEAM=['Andreea','Ștefania','Paula'];
  function norm(s){return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[șş]/g,'s').replace(/[țţ]/g,'t');}
  function ft(s){return norm(s).split(/[\s@._-]+/)[0]||'';}
  function map(login){if(!login)return '';var nl=norm(login),fl=ft(login);for(var i=0;i<TEAM.length;i++){var p=TEAM[i],np=norm(p);if(np===nl||np===fl||ft(p)===fl)return p;}return '';}
  function apply(){
    var login=''; try{login=localStorage.getItem('soi-grupuri-loginname')||'';}catch(e){}
    var m=map(login); if(!m)return;
    if(typeof S!=='undefined' && S.ui && typeof setEu==='function' && S.ui.eu!==m) setEu(m);
  }
  try{apply();}catch(e){}
  setTimeout(function(){try{apply();}catch(e){}},600);
})();
</script>
