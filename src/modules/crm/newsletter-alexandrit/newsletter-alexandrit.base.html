<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator newsletter Alexandrit</title>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:Manrope,"Helvetica Neue",Arial,sans-serif; font-size:14px; color:#1F2937; background:#F4F6F9; display:flex; flex-direction:column; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:#fff; border-bottom:1px solid #E6E9EE; }
  .bar .sp { flex:1; }
  .bar button, .bar .seg button { font-family:inherit; font-size:13px; font-weight:700; padding:8px 12px; border-radius:8px; border:1.5px solid #D5DBE4; background:#fff; color:#154A85; cursor:pointer; }
  .bar button:hover { border-color:#154A85; }
  .bar button.primary { background:#154A85; border-color:#154A85; color:#fff; }
  .seg { display:inline-flex; }
  .seg button { border-radius:0; margin-left:-1.5px; }
  .seg button:first-child { border-radius:8px 0 0 8px; margin-left:0; }
  .seg button:last-child { border-radius:0 8px 8px 0; }
  .seg button.on { background:#EAF0F8; border-color:#154A85; position:relative; }
  .wrap { flex:1; min-height:0; display:flex; }
  .form { width:400px; max-width:46%; overflow:auto; padding:16px 18px 40px; background:#fff; border-right:1px solid #E6E9EE; }
  .prev { flex:1; min-width:0; display:flex; justify-content:center; background:#EEF1F5; overflow:auto; }
  #frame { border:0; width:100%; height:100%; background:#EEF1F5; }
  .prev.mob #frame { width:393px; max-width:100%; border-left:1px solid #C9D1DC; border-right:1px solid #C9D1DC; background:#fff; }
  h2 { font-family:Sora,Manrope,Arial,sans-serif; font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:#154A85; margin:22px 0 4px; padding-bottom:5px; border-bottom:1px solid #E6E9EE; }
  h2:first-of-type { margin-top:12px; }
  label { display:block; font-size:12px; font-weight:700; color:#374151; margin:11px 0 4px; }
  input[type=text], textarea, select { width:100%; padding:8px 10px; border:1.5px solid #D5DBE4; border-radius:8px; font-size:13px; font-family:inherit; background:#fff; color:#1F2937; }
  textarea { resize:vertical; line-height:1.45; }
  input:focus, textarea:focus, select:focus { outline:2px solid #154A85; outline-offset:0; border-color:#154A85; }
  .hint { font-size:11px; color:#6B7788; margin-top:3px; line-height:1.4; }
  .row { display:flex; gap:6px; }
  .row input { flex:1; }
  .row button { flex:none; font-family:inherit; font-size:12px; font-weight:700; padding:0 10px; border-radius:8px; border:1.5px solid #D5DBE4; background:#fff; color:#154A85; cursor:pointer; }
  .tdesc { font-size:12px; color:#6B7788; margin:6px 0 0; line-height:1.4; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); max-width:min(560px,92vw); background:#0B1F4D; color:#fff; padding:12px 16px; border-radius:10px; font-size:13px; line-height:1.4; opacity:0; pointer-events:none; transition:.2s; z-index:9; }
  .toast.show { opacity:1; transform:translateX(-50%); }
  .mtabs { display:none; }
  @media (max-width:820px) {
    .wrap { flex-direction:column; }
    .form { width:100%; max-width:none; max-height:50%; border-right:0; border-bottom:1px solid #E6E9EE; }
  }
</style>
</head>
<body>
<div class="bar">
  <strong style="font-family:Sora,Manrope,Arial,sans-serif;color:#0B1F4D;">Newsletter Alexandrit</strong>
  <span class="seg" id="pm"><button type="button" data-m="d" class="on">Desktop</button><button type="button" data-m="m">Mobil</button></span>
  <span class="sp"></span>
  <button type="button" id="resetBtn">Resetează șablonul</button>
  <button type="button" id="dlBtn">Descarcă .html</button>
  <button type="button" id="copyBtn" class="primary">Copiază codul HTML</button>
</div>
<div class="wrap">
  <div class="form" id="form"></div>
  <div class="prev" id="prev"><iframe id="frame" title="Previzualizare newsletter"></iframe></div>
</div>
<div class="toast" id="ok"></div>
<script>
/* ===== Newsletter Alexandrit: șabloane de email (tabele, 600px) pentru Newsman ===== */
var C = {blue:'#154A85', navy:'#0B1F4D', foot:'#071936', green:'#2A7D44', mint:'#A8E8BB', soft:'#EAF0F8', gsoft:'#E9F6EC', asoft:'#FBF1DE', amber:'#8A5A12', line:'#E6E9EE', ink:'#374151', mut:'#4A5A6E', page:'#EEF1F5', panel:'#F7F8FA', white:'#FFFFFF'};
var FB = "Manrope,'Helvetica Neue',Arial,sans-serif", FS = "Sora,Manrope,'Helvetica Neue',Arial,sans-serif";
var SITE = 'https://alexandrit.ro';
var LOGO = SITE + '/alexandrit-logo-email.png', LOGOW = SITE + '/alexandrit-logo-alb.png', VLAD = SITE + '/newsletter/campanie-30-zile/vlad.jpg';
var MAIL = 'vlad.placinta@alexandrit.ro', TEL = '0757 401 042', TELH = '+40757401042';
var REASONS = [
  ['adresa ta se află în lista de contacte Alexandrit', 'adresa ta se află în lista de contacte Alexandrit'],
  ['ți-ai creat un cont Alexandrit', 'ți-ai creat un cont Alexandrit'],
  ['ai un cont Alexandrit', 'ai un cont Alexandrit']
];

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* **îngroșat** și rând nou; hl = îngroșatul primește fundal verde deschis */
function rich(s, hl){
  var b = hl ? '<strong style="background-color:#CDEFD8;color:#0B3D1F;padding:0 3px;font-weight:800;">$1</strong>' : '<strong style="font-weight:800;">$1</strong>';
  return esc(s).replace(/\*\*(.+?)\*\*/g, b).replace(/\n/g, '<br>');
}
/* adaugă UTM doar pe linkurile către alexandrit.ro */
function U(url, slot, v){
  url = String(url || '').trim();
  if(!/^https?:\/\/(www\.)?alexandrit\.ro(\/|\?|$)/i.test(url) || /utm_source=/.test(url)) return url;
  return url + (url.indexOf('?') < 0 ? '?' : '&') + 'utm_source=newsletter&utm_medium=email&utm_campaign=' + encodeURIComponent((v.UTM || 'newsletter').trim()) + '&utm_content=' + encodeURIComponent(slot);
}
function R(bg, pad, inner, extra){
  return '<tr><td bgcolor="' + bg + '" class="pad" style="background-color:' + bg + ';padding:' + pad + ';' + (extra || '') + '">' + inner + '</td></tr>';
}
function SP(h){ return '<div style="height:' + h + 'px;line-height:' + h + 'px;font-size:1px;">&nbsp;</div>'; }
function P(txt, o){
  o = o || {};
  return '<p style="margin:' + (o.m || '0') + ';font-family:' + (o.f || FB) + ';font-size:' + (o.s || 16) + 'px;line-height:' + (o.l || 25) + 'px;' + (o.w ? 'font-weight:' + o.w + ';' : '') + 'color:' + (o.c || C.ink) + ';' + (o.a ? 'text-align:' + o.a + ';' : '') + '">' + (o.raw ? txt : rich(txt, o.hl)) + '</p>';
}
function EY(txt, color, m){
  return '<div style="' + (m ? 'margin:' + m + ';' : '') + 'font-family:' + FB + ';font-size:11px;line-height:16px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:' + (color || C.green) + ';">' + esc(txt) + '</div>';
}
function H(txt, o){
  o = o || {};
  var tag = o.t || 'h2';
  return '<' + tag + ' class="' + (o.cls || 'h2') + '" style="margin:' + (o.m || '0') + ';font-family:' + FS + ';font-size:' + (o.s || 26) + 'px;line-height:' + (o.l || 32) + 'px;font-weight:700;letter-spacing:' + (o.ls || '-0.6px') + ';color:' + (o.c || C.blue) + ';">' + esc(txt) + '</' + tag + '>';
}
var Hx = H;
function BTN(label, href, o){
  o = o || {};
  var bg = o.bg || C.green, col = o.color || '#FFFFFF';
  return '<table role="presentation" class="btn" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" bgcolor="' + bg + '" style="background-color:' + bg + ';border-radius:12px;"><a href="' + esc(href) + '" style="display:inline-block;padding:15px 30px;font-family:' + FB + ';font-size:16px;line-height:20px;font-weight:800;color:' + col + ';text-decoration:none;">' + esc(label) + '</a></td></tr></table>';
}
function LINK(txt, href, o){
  o = o || {};
  return '<a href="' + esc(href) + '" style="color:' + (o.c || C.blue) + ';font-weight:' + (o.w || 700) + ';text-decoration:underline;">' + esc(txt) + '</a>';
}
function HDR(label){
  return R(C.white, '22px 32px',
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>'
    + '<td align="left" valign="middle"><a href="' + SITE + '/"><img src="' + LOGO + '" width="130" alt="Alexandrit" style="display:block;width:130px;height:auto;"></a></td>'
    + '<td align="right" valign="middle" style="font-family:' + FB + ';font-size:12px;line-height:16px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:' + C.blue + ';">' + esc(label) + '</td>'
    + '</tr></table>', 'border-bottom:1px solid ' + C.line + ';');
}
function FOOT(v){
  var why = v.WHY || REASONS[0][0];
  var l = function(t, p){ return '<a href="' + esc(U(SITE + '/' + p, 'subsol', v)) + '" style="color:#FFFFFF;">' + t + '</a>'; };
  return '<tr><td bgcolor="' + C.foot + '" class="pad" align="center" style="background-color:' + C.foot + ';padding:36px 28px 28px 28px;">'
    + '<a href="' + esc(U(SITE + '/', 'subsol-logo', v)) + '" style="display:block;"><img src="' + LOGOW + '" width="150" alt="Alexandrit" style="display:block;margin:0 auto;width:150px;height:auto;"></a>'
    + '<p style="margin:14px 0 0 0;font-family:' + FB + ';font-size:13px;line-height:18px;color:#8D9AB0;text-align:center;">Platforma CRM pentru ONG-uri din România.</p>'
    + '<p style="margin:16px 0 0 0;font-family:' + FB + ';font-size:13px;line-height:22px;font-weight:700;text-align:center;">'
    + l('Cum funcționează', 'cum-functioneaza') + ' &nbsp;·&nbsp; ' + l('Prețuri', 'hub') + ' &nbsp;·&nbsp; ' + l('Întrebări frecvente', 'intrebari-frecvente') + ' &nbsp;·&nbsp; ' + l('Contact', 'contact') + '</p>'
    + '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:22px;"><tr><td style="border-top:1px solid #1B2C4D;padding-top:16px;font-family:' + FB + ';font-size:11px;line-height:17px;color:#8D9AB0;text-align:center;">'
    + 'Primești acest mesaj pentru că ' + esc(why) + '. <a href="##NEWSMAN:list_unsubscribe##" style="color:#C3CCDC;text-decoration:underline;">Dezabonare</a>.<br><br>'
    + 'MEDIGROUPPLUS SRL · CUI 38103518 · J07/617/2017<br>Str. Prieteniei nr. 4, sat Boscoteni, com. Frumușica, jud. Botoșani<br>© 2026 Alexandrit'
    + '</td></tr></table></td></tr>';
}
function DOC(v, rows){
  var pre = esc(v.PRE || '');
  var pad = ''; for(var i = 0; i < 30; i++){ pad += '&nbsp;&zwnj;'; }
  return '<!DOCTYPE html>\n<html lang="ro" xmlns="http://www.w3.org/1999/xhtml">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta http-equiv="X-UA-Compatible" content="IE=edge">\n<meta name="x-apple-disable-message-reformatting">\n<meta name="color-scheme" content="light">\n<title>' + esc(v.SUBJ || 'Alexandrit') + '</title>\n'
    + '<style type="text/css">\nbody{margin:0;padding:0;-webkit-text-size-adjust:100%;}\ntable{border-collapse:collapse;}\nimg{border:0;}\n'
    + '@media only screen and (max-width:620px){\n.wrap{width:100%!important;max-width:100%!important;}\n.pad{padding-left:20px!important;padding-right:20px!important;}\n.col{display:block!important;width:100%!important;}\n.h1{font-size:30px!important;line-height:36px!important;}\n.h2{font-size:23px!important;line-height:29px!important;}\n.big{font-size:72px!important;line-height:72px!important;}\n.gap{padding-left:0!important;padding-top:14px!important;}\n.btn,.btn td,.btn a{display:block!important;width:100%!important;box-sizing:border-box;}\n}\n</style>\n</head>\n'
    + '<body style="margin:0;padding:0;background-color:' + C.page + ';">\n'
    + '<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">' + pre + '&nbsp;&zwnj;' + pad + '</div>\n'
    + '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:' + C.page + ';"><tr><td align="center" style="padding:12px 8px 16px 8px;">\n'
    + '<table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;font-family:' + FB + ';">\n'
    + '<tr><td align="right" style="padding:0 4px 8px 0;font-family:' + FB + ';font-size:11px;line-height:16px;"><a href="##NEWSMAN:view_online##" style="color:#5B6A7E;text-decoration:underline;">Vezi în browser</a></td></tr>\n'
    + rows + '\n'
    + '</table>\n</td></tr></table>\n</body>\n</html>\n';
}
function split(s){ return String(s || '').split('\n').map(function(x){ return x.trim(); }).filter(function(x){ return x; }); }

/* câmpuri comune fiecărui șablon: subiect, previzualizare, campanie, motivul din subsol */
function common(subj, pre, utm, why){
  return [
    {h:'Email (se completează în Newsman)'},
    {id:'SUBJ', label:'Subiectul emailului', def:subj, copy:1, hint:'Pe telefon se văd ~45 de caractere; pune esențialul la început.'},
    {id:'PRE', label:'Textul de previzualizare din inbox', def:pre, type:'a', rows:2, copy:1},
    {id:'UTM', label:'Numele campaniei (intră în linkuri, utm_campaign)', def:utm},
    {id:'WHY', label:'Motivul din subsol („Primești acest mesaj pentru că…”)', type:'s', options:REASONS, def:why || REASONS[0][0]}
  ];
}

/* ---------- 1. Bun venit ---------- */
function bunVenit(v){
  var rows = HDR(v.LBL);
  rows += R(C.blue, '44px 32px 44px 32px',
    '<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="border:1.5px solid #6D93C3;border-radius:20px;padding:7px 16px;font-family:' + FB + ';font-size:12px;line-height:16px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#FFFFFF;">' + esc(v.PILL) + '</td></tr></table>'
    + '<h1 class="h1" style="margin:22px 0 0 0;font-family:' + FS + ';font-size:42px;line-height:48px;font-weight:700;letter-spacing:-1.3px;color:#FFFFFF;">' + esc(v.H1A) + '<br><span style="color:' + C.mint + ';">' + esc(v.H1B) + '</span></h1>'
    + P(v.LEAD, {m:'16px 0 0 0', s:18, l:28, c:'#DCE6F3'}) + SP(22)
    + BTN(v.BTN, U(v.URL, 'hero', v), {bg:C.mint, color:C.navy}));
  rows += R(C.white, '40px 32px 8px 32px', EY(v.EYE) + Hx(v.H2, {m:'6px 0 0 0', s:28, l:34}));
  [1, 2, 3].forEach(function(n){
    rows += R(C.white, '12px 32px 0 32px',
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="' + C.panel + '" style="background-color:' + C.panel + ';border:1px solid ' + C.line + ';border-radius:16px;"><tr>'
      + '<td width="66" valign="top" style="padding:22px 0 22px 22px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="40" height="40" align="center" valign="middle" bgcolor="' + C.blue + '" style="background-color:' + C.blue + ';border-radius:20px;font-family:' + FS + ';font-size:16px;font-weight:700;color:#FFFFFF;">' + n + '</td></tr></table></td>'
      + '<td valign="top" style="padding:20px 22px 20px 6px;"><div style="font-family:' + FS + ';font-size:18px;line-height:24px;font-weight:700;color:' + C.blue + ';">' + esc(v['S' + n + 'T']) + '</div><div style="margin-top:4px;font-family:' + FB + ';font-size:15px;line-height:23px;color:' + C.mut + ';">' + rich(v['S' + n + 'D']) + '</div></td>'
      + '</tr></table>');
  });
  rows += R(C.white, '0 0 0 0', SP(36));
  rows += R(C.soft, '28px 32px',
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>'
    + '<td class="col" width="92" valign="middle"><img src="' + VLAD + '" width="76" height="76" alt="Vlad Plăcintă" style="display:block;width:76px;height:76px;border-radius:38px;"></td>'
    + '<td class="col gap" valign="middle" style="padding-left:6px;"><div style="font-family:' + FS + ';font-size:19px;line-height:26px;font-weight:700;color:' + C.blue + ';">' + esc(v.FN) + '</div>'
    + '<div style="margin-top:4px;font-family:' + FB + ';font-size:14px;line-height:21px;color:' + C.mut + ';"><a href="mailto:' + MAIL + '" style="color:' + C.blue + ';">' + MAIL + '</a> · <a href="tel:' + TELH + '" style="color:' + C.blue + ';">' + TEL + '</a></div></td>'
    + '</tr></table>');
  rows += FOOT(v);
  return DOC(v, rows);
}

/* ---------- 2. Noutăți lunare ---------- */
function noutati(v){
  var rows = HDR(v.LBL);
  rows += R(C.navy, '36px 32px',
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>'
    + '<td class="col" width="170" valign="middle"><div class="big" style="font-family:' + FS + ';font-size:104px;line-height:100px;font-weight:700;letter-spacing:-5px;color:' + C.mint + ';">' + esc(v.NUM) + '</div></td>'
    + '<td class="col gap" valign="middle" style="padding-left:8px;"><h1 class="h2" style="margin:0;font-family:' + FS + ';font-size:27px;line-height:33px;font-weight:700;letter-spacing:-0.7px;color:#FFFFFF;">' + esc(v.NH) + '</h1>'
    + P(v.NS, {m:'12px 0 0 0', s:15, l:23, c:'#C3CCDC'}) + '</td></tr></table>');
  var cats = [[1, 3, C.blue, C.soft], [4, 6, C.green, C.gsoft]];
  cats.forEach(function(c, ci){
    var items = [];
    for(var n = c[0]; n <= c[1]; n++){ if((v['I' + n + 'T'] || '').trim()){ items.push(n); } }
    if(!items.length) return;
    rows += R(C.white, (ci ? '28px' : '36px') + ' 32px 0 32px',
      '<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="' + c[3] + '" style="background-color:' + c[3] + ';border-radius:16px;padding:7px 14px;font-family:' + FB + ';font-size:12px;line-height:16px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:' + c[2] + ';">' + esc(v['CAT' + (ci + 1)]) + '</td></tr></table>');
    items.forEach(function(n, k){
      rows += R(C.white, '0 32px', '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:18px 0;' + (1 ? 'border-bottom:1px solid ' + C.line + ';' : '') + '">'
        + '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>'
        + '<td class="col" width="70" valign="top" style="padding-top:4px;font-family:' + FB + ';font-size:12px;line-height:16px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:' + C.mut + ';">' + esc(v['I' + n + 'D']) + '</td>'
        + '<td class="col" valign="top"><div style="font-family:' + FS + ';font-size:18px;line-height:24px;font-weight:700;color:' + C.blue + ';">' + esc(v['I' + n + 'T']) + '</div>'
        + '<div style="margin-top:4px;font-family:' + FB + ';font-size:14px;line-height:22px;color:' + C.mut + ';">' + rich(v['I' + n + 'X']) + '</div></td>'
        + '</tr></table></td></tr></table>');
    });
  });
  rows += R(C.white, '28px 32px 0 32px',
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="' + C.soft + '" style="background-color:' + C.soft + ';border-radius:16px;"><tr><td style="padding:28px;">'
    + Hx(v.IDT, {m:'0', s:22, l:28}) + P(v.IDD, {m:'8px 0 0 0', s:15, l:23}) + SP(18) + BTN(v.IDB, U(v.IDU, 'idee', v), {bg:C.blue}) + '</td></tr></table>');
  rows += R(C.white, '22px 32px 40px 32px', '<span style="font-family:' + FB + ';font-size:15px;line-height:22px;">' + LINK(v.ALL, U(v.ALLU, 'toate-noutatile', v)) + '</span>');
  rows += FOOT(v);
  return DOC(v, rows);
}

/* ---------- 3. Termenul ---------- */
function termenul(v){
  var rows = HDR(v.LBL);
  var cal = '<table role="presentation" width="150" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="background-color:#FFFFFF;border:1px solid #EBD9B4;border-radius:16px;">'
    + '<tr><td align="center" bgcolor="' + C.blue + '" style="background-color:' + C.blue + ';border-radius:15px 15px 0 0;padding:11px 0;font-family:' + FB + ';font-size:13px;line-height:16px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#FFFFFF;">' + esc(v.MON) + '</td></tr>'
    + '<tr><td align="center" style="padding:8px 0 0 0;font-family:' + FS + ';font-size:78px;line-height:84px;font-weight:700;letter-spacing:-3px;color:' + C.blue + ';">' + esc(v.DAY) + '</td></tr>'
    + '<tr><td align="center" style="padding:0 0 18px 0;font-family:' + FB + ';font-size:13px;line-height:16px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:' + C.amber + ';">' + esc(v.CAL) + '</td></tr></table>';
  rows += R(C.asoft, '40px 32px',
    '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>'
    + '<td class="col" width="172" valign="top">' + cal + '</td>'

/* ===== starea formularului, salvată în browser ===== */
var STORE = 'nla_v1', STATE = {}, CUR = T[0].id, MODE = 'd';
function byId(id){ for(var i = 0; i < T.length; i++){ if(T[i].id === id) return T[i]; } return null; }
try { var raw = localStorage.getItem(STORE); if(raw){ var o = JSON.parse(raw); STATE = o.s || {}; if(o.c && byId(o.c)) CUR = o.c; } } catch(e){}
function save(){ try { localStorage.setItem(STORE, JSON.stringify({c:CUR, s:STATE})); } catch(e){} }
function vals(t){
  var v = {}, s = STATE[t.id] || {};
  t.fields.forEach(function(f){ if(f.id){ v[f.id] = (f.id in s) ? s[f.id] : f.def; } });
  return v;
}
function toast(msg){ var el = document.getElementById('ok'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('show'); }, 5200); }
function copyText(txt, done){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); }); }
  else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt){ var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); }

var timer = null;
function build(){ var t = byId(CUR); return t.build(vals(t)); }
function refresh(){
  var fr = document.getElementById('frame');
  fr.srcdoc = build();
  document.getElementById('prev').classList.toggle('mob', MODE === 'm');
}
function later(){ clearTimeout(timer); timer = setTimeout(refresh, 200); }

function renderForm(){
  var t = byId(CUR), form = document.getElementById('form'), v = vals(t);
  form.innerHTML = '';
  var h = document.createElement('h2'); h.textContent = 'Șablon'; form.appendChild(h);
  var sel = document.createElement('select');
  T.forEach(function(x){ var o = document.createElement('option'); o.value = x.id; o.textContent = x.name; if(x.id === CUR) o.selected = true; sel.appendChild(o); });
  sel.addEventListener('change', function(){ CUR = sel.value; save(); renderForm(); refresh(); });
  form.appendChild(sel);
  var d = document.createElement('div'); d.className = 'tdesc'; d.textContent = t.desc; form.appendChild(d);
  t.fields.forEach(function(f){
    if(f.h){ var hh = document.createElement('h2'); hh.textContent = f.h; form.appendChild(hh); return; }
    var lb = document.createElement('label'); lb.textContent = f.label; form.appendChild(lb);
    var inp;
    if(f.type === 'a'){ inp = document.createElement('textarea'); inp.rows = f.rows || 3; }
    else if(f.type === 's'){ inp = document.createElement('select'); f.options.forEach(function(op){ var o = document.createElement('option'); o.value = op[0]; o.textContent = op[1]; inp.appendChild(o); }); }
    else { inp = document.createElement('input'); inp.type = 'text'; }
    inp.value = v[f.id];
    function onIn(){ (STATE[CUR] = STATE[CUR] || {})[f.id] = inp.value; save(); later(); }
    inp.addEventListener('input', onIn); inp.addEventListener('change', onIn);
    if(f.copy){
      var row = document.createElement('div'); row.className = 'row'; row.appendChild(inp);
      var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Copiază';
      b.addEventListener('click', function(){ copyText(inp.value, function(){ toast('Copiat: ' + f.label); }); });
      row.appendChild(b); form.appendChild(row);
    } else { form.appendChild(inp); }
    if(f.hint){ var hi = document.createElement('div'); hi.className = 'hint'; hi.textContent = f.hint; form.appendChild(hi); }
  });
}

/* ===== verificări înainte de copiere ===== */
function visibleText(html){ return html.replace(/<style[\s\S]*?<\/style>/g, '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;|&zwnj;/g, ' '); }
function checks(){
  var t = byId(CUR), v = vals(t), html = build(), w = [];
  if(!(v.SUBJ || '').trim()) w.push('Subiectul emailului e gol.');
  if((v.SUBJ || '').length > 60) w.push('Subiectul are ' + v.SUBJ.length + ' caractere; pe telefon se văd ~45.');
  var br = visibleText(html).match(/\[[^\]]{2,80}\]/g);
  if(br){ w.push('Au rămas texte între paranteze drepte de completat: ' + br.slice(0, 4).join(' ') + (br.length > 4 ? ' …' : '')); }
  if(!(v.UTM || '').trim()) w.push('Numele campaniei (UTM) e gol; linkurile nu vor putea fi urmărite.');
  return w;
}
function doCopy(){
  var w = checks();
  if(w.length && !confirm('Înainte să copiezi:\n\n• ' + w.join('\n• ') + '\n\nCopiez oricum?')) return;
  copyText(build(), function(){ toast('Copiat! În Newsman: Creează newsletter → HTML → lipește codul. Subiectul și textul de previzualizare le copiezi cu butoanele de lângă ele. Trimite doar teste la adresa ta, nu către listă.'); });
}
document.getElementById('copyBtn').addEventListener('click', doCopy);
document.getElementById('dlBtn').addEventListener('click', function(){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([build()], {type:'text/html'}));
  a.download = 'newsletter-alexandrit-' + CUR.replace(/_/g, '-') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById('resetBtn').addEventListener('click', function(){
  if(!confirm('Resetezi șablonul „' + byId(CUR).name + '” la textele de start?')) return;
  delete STATE[CUR]; save(); renderForm(); refresh();
});
document.querySelectorAll('#pm button').forEach(function(b){
  b.addEventListener('click', function(){
    MODE = b.getAttribute('data-m');
    document.querySelectorAll('#pm button').forEach(function(x){ x.classList.toggle('on', x === b); });
    refresh();
  });
});
renderForm();
refresh();
</script>
