<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator one-pager — salvează o inimă</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; background:#F2EFEA; color:#1F1B17; }
  .top { background:#C41D33; color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .top h1 { margin:0; font-size:17px; font-weight:800; }
  .top .btns button { border:0; border-radius:50px; padding:10px 18px; font-size:13px; font-weight:800; cursor:pointer; margin-left:8px; }
  #copyBtn { background:#fff; color:#C41D33; }
  #printBtn { background:rgba(255,255,255,.15); color:#fff; border:1.5px solid rgba(255,255,255,.6) !important; }
  .wrap { display:flex; height:calc(100vh - 62px); }
  .form { width:400px; min-width:300px; max-width:80vw; flex-shrink:0; overflow-y:auto; background:#fff; padding:18px 20px 60px 20px; order:1; }
  #dragHandle { flex:0 0 6px; width:6px; cursor:col-resize; background:#EAE5DC; border-left:1px solid #E4DFD7; border-right:1px solid #E4DFD7; order:2; position:relative; }
  #dragHandle:hover, #dragHandle.dragging { background:#E0263C; }
  #dragHandle::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:2px; height:28px; border-radius:2px; background:#C9C2B6; }
  #dragHandle:hover::after, #dragHandle.dragging::after { background:#fff; }
  .prev { flex:1; min-width:0; overflow:auto; order:3; background:#EAE5DC; }
  @media (max-width:640px){ #dragHandle { display:none; } }
  .prev iframe { width:100%; height:100%; border:0; background:#fff; display:block; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:#C41D33; margin:22px 0 8px 0; border-bottom:1px solid #F0EBE3; padding-bottom:6px; }
  h2:first-child { margin-top:0; }
  label { display:block; font-size:12px; font-weight:700; color:#55504A; margin:10px 0 4px 0; }
  input[type=text], textarea { width:100%; padding:9px 10px; border:1.5px solid #E4DFD7; border-radius:8px; font-size:13px; font-family:inherit; }
  input:focus, textarea:focus { outline:none; border-color:#E0263C; }
  textarea { resize:vertical; }
  button:focus-visible, label.filebtn:focus-within { outline:2px solid #E0263C; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ * { transition:none !important; animation:none !important; } }
  .hint { font-size:11px; color:#7A736A; margin-top:3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid4 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .filebox { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .filebtn { display:inline-block; background:#FAF7F2; border:1.5px dashed #C9C2B6; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; color:#55504A; cursor:pointer; }
  .filebtn:hover { border-color:#E0263C; color:#E0263C; }
  .filename { font-size:12px; color:#1F1B17; font-weight:600; background:#F0EBE3; border-radius:6px; padding:5px 10px; display:none; align-items:center; gap:6px; }
  .filename button { border:0; background:none; color:#C41D33; font-weight:800; cursor:pointer; font-size:13px; padding:0; }
  input[type=file] { display:none; }
  .ok { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1F1B17; color:#fff; padding:12px 24px; border-radius:14px; font-size:13px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; max-width:520px; text-align:center; line-height:1.5; z-index:99; }
  .ok.show { opacity:1; }
  .mtabs { display:none; }
  @media (max-width:640px){
    .wrap{flex-direction:column; height:auto;} .form{width:100%;} .prev{height:80vh;}
    .mtabs { display:flex; gap:8px; padding:8px 12px; background:#EAE5DC; border-bottom:1px solid #E4DFD7; position:sticky; top:0; z-index:20; }
    .mtabs button { flex:1; border:1.5px solid #C9C2B6; background:#fff; color:#55504A; border-radius:50px; padding:9px; font-size:13px; font-weight:800; cursor:pointer; }
    .mtabs button.on { background:#C41D33; border-color:#C41D33; color:#fff; }
    .wrap.mp-prev .form { display:none; }
    .wrap:not(.mp-prev) .prev { display:none; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>📄 Generator one-pager</h1>
  <div class="btns">
    <button id="printBtn">🖨 Printează / descarcă PDF</button>
    <button id="copyBtn">📋 Copiază codul HTML</button>
  </div>
</div>
<div class="mtabs">
  <button type="button" data-mt="form" class="on">✏️ Editez</button>
  <button type="button" data-mt="prev">👁 Previzualizez</button>
</div>
<div class="wrap">
  <div class="form">
    <h2>Branding</h2>
    <label>Logo (opțional)</label>
    <div class="filebox">
      <label class="filebtn" for="LOGO_IMG_FILE">📁 Încarcă logo</label>
      <span class="filename" id="LOGO_IMG_NAME"><span></span><button title="Renunță la fișier">✕</button></span>
    </div>
    <input type="file" id="LOGO_IMG_FILE" accept="image/*">
    <div class="hint">Culorile prezentării (antet, accente) se adaptează automat după culoarea dominantă din logo. Fără logo, rămâne paleta albastră implicită.</div>

    <label>Numele organizației</label>
    <input type="text" id="ORG_NUME" value="Asociația Salvează o Inimă">
    <label>Motto / eticheta de sub antet</label>
    <input type="text" id="TAGLINE" value="Prezentare pentru potențiali parteneri">

    <h2>Introducere</h2>
    <label>Titlu principal</label>
    <input type="text" id="INTRO_TITLU" value="Împreună dăm o șansă la viață copiilor cu boli grave">
    <label>Text introductiv</label>
    <textarea id="INTRO_TEXT" rows="3">De 13 ani sprijinim familii aflate în situații medicale grele — tratamente, intervenții și drumul spre vindecare, cu ajutorul oamenilor și companiilor care aleg să rămână alături de noi.</textarea>

    <h2>Misiunea noastră</h2>
    <label>Text misiune</label>
    <textarea id="MISIUNE_TEXT" rows="4">Credem că niciun copil nu ar trebui să lupte singur cu o boală gravă din cauza lipsei de fonduri. Misiunea noastră este să conectăm oameni și companii generoase cu familii aflate în nevoie, transparent și verificat, de la prima donație până la recuperare.</textarea>

    <h2>Impactul nostru (4 cifre)</h2>
    <div class="grid4">
      <div><label>Cifra 1</label><input type="text" id="N1" value="13"></div>
      <div><label>Etichetă 1</label><input type="text" id="L1" value="ani de activitate"></div>
      <div><label>Cifra 2</label><input type="text" id="N2" value="675+"></div>
      <div><label>Etichetă 2</label><input type="text" id="L2" value="campanii susținute"></div>
      <div><label>Cifra 3</label><input type="text" id="N3" value="137.000+"></div>
      <div><label>Etichetă 3</label><input type="text" id="L3" value="donatori"></div>
      <div><label>Cifra 4</label><input type="text" id="N4" value="1.700+"></div>
      <div><label>Etichetă 4</label><input type="text" id="L4" value="companii partenere"></div>
    </div>

    <h2>Problema &amp; ce facem</h2>
    <label>PROBLEMA — titlu</label>
    <input type="text" id="PROBLEMA_TITLU" value="Problema">
    <label>PROBLEMA — text</label>
    <textarea id="PROBLEMA_TEXT" rows="4">Multe familii ajung să afle un diagnostic grav fără resursele necesare pentru tratament. Fără sprijin rapid, o programare medicală se poate pierde — iar timpul, pentru un copil bolnav, nu așteaptă.</textarea>
    <label>CE FACEM — titlu</label>
    <input type="text" id="CEFACEM_TITLU" value="Ce facem">
    <label>CE FACEM — text</label>
    <textarea id="CEFACEM_TEXT" rows="4">Verificăm fiecare caz, strângem fonduri prin campanii transparente și facem legătura directă între donatori și tratament — raportăm public fiecare etapă, de la strângerea sumei până la recuperare.</textarea>

    <h2>Implică-te</h2>
    <label>Text</label>
    <textarea id="IMPLICA_TEXT" rows="2">Alătură-te companiilor și oamenilor care aleg să facă parte din soluție — orice formă de sprijin contează.</textarea>
    <label>Text buton</label>
    <input type="text" id="IMPLICA_CTA" value="Devino partener">
    <label>Link (site / pagină de contact)</label>
    <input type="text" id="LINK" value="https://salveazaoinima.ro">

    <h2>Hai să vorbim</h2>
    <div class="grid2">
      <div><label>Telefon</label><input type="text" id="CONTACT_TEL" value="+40 7xx xxx xxx"></div>
      <div><label>Email</label><input type="text" id="CONTACT_EMAIL" value="contact@salveazaoinima.ro"></div>
    </div>
    <label>Website (text afișat)</label>
    <input type="text" id="CONTACT_WEB" value="salveazaoinima.ro">
    <label>Adresă</label>
    <input type="text" id="CONTACT_ADRESA" value="București, România">
  </div>
  <div id="dragHandle" title="Trage pentru a redimensiona"></div>
  <div class="prev">
    <iframe id="frame"></iframe>
  </div>
</div>
<div class="ok" id="ok" role="status" aria-live="polite"></div>

<script type="text/plain" id="tpl"><!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }

  body { font-family:'Poppins',Arial,sans-serif; color:#22252A; background:#EDEEF0; }
  .page { max-width:850px; margin:0 auto; background:#ffffff; box-shadow:0 10px 40px rgba(0,0,0,.12); }
  .band { padding:38px 56px; }

  .header .tag { font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.65); }
  .hero { background:{{BR_PRIMARY}}; color:#fff; text-align:center; padding:46px 56px 40px; }
  .hero h1 { font-family:'Merriweather',Georgia,serif; font-weight:900; font-size:30px; line-height:1.25; margin:0 auto; max-width:640px; }
  .hero p { font-size:14px; line-height:1.7; color:rgba(255,255,255,.9); max-width:560px; margin:16px auto 0; }

  .mission { padding:36px 56px 8px; }
  .mission p { font-size:14px; line-height:1.75; color:#4B4F57; margin:0; }
  .stats { padding:28px 56px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat { background:{{BR_LIGHT}}; border-radius:14px; padding:18px 10px; text-align:center; }
  .stat .num { font-family:'Merriweather',Georgia,serif; font-weight:900; font-size:22px; color:{{BR_DARK}}; }
  .stat .lbl { font-size:10.5px; color:#6B7280; margin-top:4px; line-height:1.4; }
  .twocol { padding:8px 56px 8px; display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .twocol h3 { font-family:'Merriweather',Georgia,serif; font-weight:900; font-size:16px; margin:0 0 8px; color:#22252A; }
  .twocol p { font-size:13px; line-height:1.7; color:#4B4F57; margin:0; }

  .cta p.lead { font-size:14px; line-height:1.6; color:rgba(255,255,255,.85); max-width:520px; margin:0 auto 18px; }
  .cta a.btn { display:inline-block; background:{{BR_PRIMARY}}; color:#fff; text-decoration:none; font-weight:700; font-size:13px; padding:13px 30px; border-radius:999px; }
  .footer { margin-top:34px; border-top:1px solid #E7E8EA; padding:24px 56px 30px; display:flex; flex-wrap:wrap; gap:18px; align-items:center; justify-content:space-between; }
  .footer .lbl2 { font-size:10.5px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:{{BR_PRIMARY}}; margin-bottom:8px; }
  .footer .row { display:flex; flex-wrap:wrap; gap:22px; font-size:12.5px; color:#4B4F57; }
  .footer .row span { white-space:nowrap; }
  @media (max-width:640px){
    .header,.hero,.mission,.stats,.twocol,.footer { padding-left:24px !important; padding-right:24px !important; }
    .cta { margin-left:24px; margin-right:24px; }
    .hero h1 { font-size:24px; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .twocol { grid-template-columns:1fr; }
  }
  @media print {
    @page { size:A4; margin:0; }
    body { background:#fff; }
    .page { box-shadow:none; max-width:100%; }
  }
</style></head>
<body>
<div class="page">
  <div class="header">
    <div class="org">
<!--LOGO_START-->
      <span class="logochip"><img src="{{LOGO_IMG}}" alt=""></span>
<!--LOGO_END-->

    <div class="stat"><div class="num">{{N3}}</div><div class="lbl">{{L3}}</div></div>

<script>
function rgbToHsl(r, g, b){
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b);
  var h = 0, s = 0, l = (max + min) / 2;
  if(max !== min){
    var d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if(max === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if(max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h: h, s: s, l: l };
}
function hex2(n){ var s = Math.max(0, Math.min(255, Math.round(n))).toString(16); return s.length === 1 ? '0' + s : s; }
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  var r = 0, g = 0, b = 0;
  if(h < 60){ r = c; g = x; b = 0; } else if(h < 120){ r = x; g = c; b = 0; } else if(h < 180){ r = 0; g = c; b = x; }
  else if(h < 240){ r = 0; g = x; b = c; } else if(h < 300){ r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
  return '#' + hex2((r + m) * 255) + hex2((g + m) * 255) + hex2((b + m) * 255);
}
function hexToRgb(hex){
  var m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
  if(!m) return null;
  var n = parseInt(m[1], 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function extractDominantColor(img){
  try {
    var size = 48;
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    var data = ctx.getImageData(0, 0, size, size).data;
    var buckets = {};
    for(var i = 0; i < data.length; i += 4){
      var r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
      if(a < 128) continue;
      var hsl = rgbToHsl(r, g, b);
      if(hsl.l < 0.12 || hsl.l > 0.92 || hsl.s < 0.15) continue;
      var key = Math.round(r / 20) + ',' + Math.round(g / 20) + ',' + Math.round(b / 20);
      if(!buckets[key]) buckets[key] = { r: 0, g: 0, b: 0, n: 0 };
      buckets[key].r += r; buckets[key].g += g; buckets[key].b += b; buckets[key].n++;
    }
    var best = null;
    for(var k in buckets){ if(!best || buckets[k].n > best.n) best = buckets[k]; }
    if(!best) return null;
    return '#' + hex2(best.r / best.n) + hex2(best.g / best.n) + hex2(best.b / best.n);
  } catch(e){ return null; }
}
var DEFAULT_BRAND = { primary: '#1B5FA6', dark: '#0E2C4C', light: '#EAF3FB' };
function deriveBrandPalette(hex){
  var rgb = hexToRgb(hex);
  if(!rgb) return DEFAULT_BRAND;
  var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
  var sat = Math.max(0.4, Math.min(0.85, hsl.s || 0.55));
  return {
    primary: hslToHex(hsl.h, sat, 0.42),
    dark: hslToHex(hsl.h, sat, 0.18),
    light: hslToHex(hsl.h, Math.max(0.18, sat * 0.3), 0.95)
  };
}
var brandHex = null;
function currentBrandPalette(){ return brandHex ? deriveBrandPalette(brandHex) : DEFAULT_BRAND; }

var tpl = document.getElementById('tpl').textContent;
var files = { LOGO_IMG: null };

function toast(msg){
  var ok = document.getElementById('ok');
  ok.textContent = msg;
  ok.classList.add('show');
  setTimeout(function(){ ok.classList.remove('show'); }, 4000);
}

(function(){
  var inp = document.getElementById('LOGO_IMG_FILE');
  var tag = document.getElementById('LOGO_IMG_NAME');
  inp.addEventListener('change', function(){
    var f = inp.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      files.LOGO_IMG = reader.result;
      tag.style.display = 'inline-flex';
      tag.querySelector('span').textContent = f.name;
      var img = new Image();
      img.onload = function(){ brandHex = extractDominantColor(img); refresh(); };
      img.onerror = function(){ brandHex = null; refresh(); };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });
  tag.querySelector('button').addEventListener('click', function(){
    files.LOGO_IMG = null;
    brandHex = null;
    inp.value = '';
    tag.style.display = 'none';
    refresh();
  });
})();

function esc(s){ return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function build(){
  var out = tpl;
  ['ORG_NUME','TAGLINE','INTRO_TITLU','PROBLEMA_TITLU','CEFACEM_TITLU','IMPLICA_CTA','LINK','CONTACT_TEL','CONTACT_EMAIL','CONTACT_WEB','CONTACT_ADRESA','N1','L1','N2','L2','N3','L3','N4','L4'].forEach(function(id){
    var v = document.getElementById(id).value;
    out = out.split('{{' + id + '}}').join(esc(v));
  });
  ['INTRO_TEXT','MISIUNE_TEXT','PROBLEMA_TEXT','CEFACEM_TEXT','IMPLICA_TEXT'].forEach(function(id){
    var v = document.getElementById(id).value;
    out = out.split('{{' + id + '}}').join(esc(v).replace(/\n/g, '<br>'));
  });
  var logoSrc = files.LOGO_IMG || '';
  out = out.split('{{LOGO_IMG}}').join(logoSrc);
  var hasLogo = !!logoSrc;
  if(!hasLogo){
    out = out.replace(/<!--LOGO_START-->[\s\S]*?<!--LOGO_END-->/, '');
  }
  var br = currentBrandPalette();
  out = out.split('{{BR_PRIMARY}}').join(br.primary);
  out = out.split('{{BR_DARK}}').join(br.dark);
  out = out.split('{{BR_LIGHT}}').join(br.light);
  return out;
}

function refresh(){
  document.getElementById('frame').srcdoc = build();
  saveDraft();
}

var DRAFT_KEY = 'soi_draft_onepager_v1';
function draftFields(){ return document.querySelectorAll('.form input[type=text], .form textarea'); }
function saveDraft(){
  try {
    var d = {};
    draftFields().forEach(function(el){ if(el.id) d[el.id] = el.value; });
    localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  } catch(e){}
}
function restoreDraft(){
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    draftFields().forEach(function(el){ if(el.id && el.id in d) el.value = d[el.id]; });
  } catch(e){}
}
restoreDraft();
draftFields().forEach(function(el){ el.addEventListener('input', refresh); });
refresh();

document.getElementById('printBtn').onclick = function(){
  var w = document.getElementById('frame').contentWindow;
  w.focus();
  w.print();
};

function copyToClipboard(text, cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(cb, function(){ fallbackCopy(text, cb); });
  } else {
    fallbackCopy(text, cb);
  }
}
function fallbackCopy(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  cb();
}
document.getElementById('copyBtn').onclick = function(){
  copyToClipboard(build(), function(){ toast('Copiat! Codul HTML al prezentării e în clipboard.'); });
};

document.querySelectorAll('.mtabs button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.mtabs button').forEach(function(x){ x.classList.toggle('on', x === b); });
    document.querySelector('.wrap').classList.toggle('mp-prev', b.getAttribute('data-mt') === 'prev');
  });
});

(function(){
  var handle = document.getElementById('dragHandle');
  var formEl = document.querySelector('.form');
  var wrapEl = document.querySelector('.wrap');
  var dragging = false;
  handle.addEventListener('mousedown', function(e){
    dragging = true;
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){
    if (!dragging) return;
    var wrapRect = wrapEl.getBoundingClientRect();
    var newWidth = e.clientX - wrapRect.left;
    newWidth = Math.max(300, Math.min(newWidth, wrapRect.width * 0.8));
    formEl.style.width = newWidth + 'px';
  });
  document.addEventListener('mouseup', function(){
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
  });
})();
</script>
