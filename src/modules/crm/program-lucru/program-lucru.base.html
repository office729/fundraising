<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program de lucru pe cazuri · salvează o inimă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#FBF7EF; --paper:#fff; --ink:#2B2320; --muted:#8A7E70;
  --red:#C22B33; --red-deep:#9E1F27; --red-soft:#F7E5E4; --line:#EAE1D2;
  --amber:#B57C22; --amber-soft:#F6ECD9; --green:#3E7C4F; --green-soft:#E4EFE6;
  --blue:#39618E; --blue-soft:#E3EAF2; --purple:#6C4A8E; --purple-soft:#EFE7F4;
  --teal:#2E6E7E; --teal-soft:#E4EEF2;
  --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--parchment);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:80px}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px}
header{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.015em}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted)}
.userbox{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number]{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--body);font-size:14px;color:var(--ink);outline:none}
.userbox select{border:1.5px solid var(--red);font-weight:600;color:var(--red-deep)}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:var(--paper);font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .12s}
.btn:hover{border-color:#D8CCB8;box-shadow:0 2px 8px rgba(43,35,32,.08)}
.btn.small{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.chipbtn{padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--body)}
.chipbtn.on{background:var(--ink);border-color:var(--ink);color:var(--parchment)}
.chipbtn .bdg{display:inline-block;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.info{background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:11px 15px;font-size:12.5px;margin-bottom:14px}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:11px 15px;font-size:12.5px;margin-bottom:14px}
.alarm{background:var(--red);color:#fff;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alarm button{margin-left:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);background:#FEFCF8;flex-wrap:wrap}
.chead b{font-family:var(--display);font-size:16px}
.chead .sub{font-size:12px;color:var(--muted);font-weight:600}
.chead .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.slot{display:flex;gap:12px;align-items:flex-start;padding:10px 15px;border-top:1px solid #F4EFE6}
.slot:first-child{border-top:none}
.slot .hh{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted);flex:none;width:102px;padding-top:1px}
.slot.break{background:var(--amber-soft)}
.slot.break .hh,.slot.break .bd{color:var(--amber);font-weight:600}
.slot.over{background:var(--red-soft)}
.slot.flex{background:#FDFBF6}
.slot.flex .bd{color:var(--muted)}
.tag.tflex{background:var(--teal-soft);color:var(--teal)}
.slot input[type=checkbox]{margin-top:2px;width:17px;height:17px;accent-color:var(--red);flex:none;cursor:pointer}
.slot.done .bd{text-decoration:line-through;color:var(--muted)}
.bd{flex:1;font-size:14px;line-height:1.45}
.byline{display:block;font-size:11px;color:var(--muted);margin-top:2px;text-decoration:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:7px;vertical-align:1px;white-space:nowrap}
.t7{background:var(--red-soft);color:var(--red-deep)}
.t15{background:var(--amber-soft);color:var(--amber)}
.t30{background:var(--blue-soft);color:var(--blue)}
.t60{background:var(--green-soft);color:var(--green)}
.tgen{background:#F1ECE2;color:var(--muted)}
.trsp{background:var(--purple-soft);color:var(--purple)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:11px 13px;cursor:pointer}
.stat.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.stat .who{font-weight:700;font-size:13.5px}
.stat .nums{font-family:var(--display);font-size:19px;margin:2px 0}
.stat .nums small{font-size:12px;color:var(--muted);font-family:var(--body)}
.pbar{height:5px;background:#F1ECE2;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--red)}
.pbar i.full{background:var(--amber)}
.pbar i.over{background:var(--red-deep)}
.frow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:12px 15px;border-top:1px solid #F4EFE6}
.frow label{font-size:12px;font-weight:700;color:var(--muted)}
.freqhead{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 15px 4px}
.empty{text-align:center;color:var(--muted);padding:32px;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--parchment);padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.mini{font-size:12px;color:var(--muted)}
.fin{padding:14px 16px 18px}
.finhead{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.finhead .sum{font-family:var(--display);font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.finhead .din{font-size:13.5px;color:var(--muted);font-weight:600}
.finhead .pct{margin-left:auto;font-family:var(--display);font-size:22px;font-weight:700;padding:2px 13px;border-radius:99px}
.pct.p0{background:#F1ECE2;color:var(--muted)}
.pct.p25{background:var(--red-soft);color:var(--red-deep)}
.pct.p50{background:var(--amber-soft);color:var(--amber)}
.pct.p75{background:var(--blue-soft);color:var(--blue)}
.pct.p100{background:var(--green-soft);color:var(--green)}
.track{position:relative;height:22px;border-radius:99px;background:linear-gradient(90deg,#F3EDE2,#EFE8DC);box-shadow:inset 0 1px 3px rgba(43,35,32,.10);overflow:hidden;margin-bottom:5px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#C22B33 0%,#D9752B 38%,#C9A227 62%,#3E7C4F 100%);background-size:340px 100%;transition:width .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 1px 6px rgba(194,43,51,.30)}
.track .fill.done{background:linear-gradient(90deg,#3E7C4F,#57A06B)}
.track .shine{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);pointer-events:none}
.track .mk{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.75);z-index:2}
.marks{position:relative;height:16px;margin-bottom:9px}
.marks span{position:absolute;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.marks span.hit{color:var(--green)}
input[type=range].fs{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer;outline:none}
input[type=range].fs::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--line)}
input[type=range].fs::-webkit-slider-thumb{-webkit-appearance:none;height:22px;width:22px;margin-top:-8px;border-radius:50%;background:#fff;border:3px solid var(--red);box-shadow:0 2px 7px rgba(43,35,32,.25)}
input[type=range].fs::-moz-range-track{height:6px;border-radius:99px;background:var(--line)}
input[type=range].fs::-moz-range-thumb{height:19px;width:19px;border-radius:50%;background:#fff;border:3px solid var(--red);box-shadow:0 2px 7px rgba(43,35,32,.25)}
.prag{display:flex;gap:8px;flex-wrap:wrap;padding:10px 15px}
.pragbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--body);color:var(--muted)}
.pragbtn.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.loadbar{display:flex;gap:6px;padding:10px 15px;flex-wrap:wrap}
.lb{flex:1;min-width:88px;background:#FBF7EF;border-radius:10px;padding:7px 9px;font-size:11.5px}
.lb b{display:block;font-size:12.5px}
.lb.ok{color:var(--green)} .lb.mid{color:var(--amber)} .lb.bad{color:var(--red-deep);background:var(--red-soft)}
@media(max-width:560px){.slot .hh{width:76px;font-size:12px}}
</style>

  SYNC_URL=SYNC_IMPLICIT;
  return SYNC_URL;
}
function urlCheie(key){
  let b=(SYNC_URL||'').trim().replace(/\/+$/,'');
  if(!b)return '';
  if(b.toLowerCase().endsWith('.json'))b=b.slice(0,-5);
  return b+'/'+key+'.json';
}
/* Timp de SERVER: fiecare răspuns de la punte are antetul HTTP „Date" (ceasul
   serverului). Calculăm offset-ul față de ceasul local, ca timestamp-urile de
   merge să fie aliniate între calculatoare, chiar dacă un PC are ceasul greșit. */
let CLOCK_OFFSET=0, CLOCK_SET=false;
function syncClock(r){
  try{ const d=r&&r.headers&&r.headers.get&&r.headers.get('date'); if(!d)return;
    const st=Date.parse(d); if(isFinite(st)){ CLOCK_OFFSET=st-Date.now(); CLOCK_SET=true; } }catch(e){}
}
async function netSet(key,s){
  const u=urlCheie(key); if(!u||typeof fetch!=='function')return false;
  try{const r=await fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:s});syncClock(r);return r.ok;}
  catch(e){return false;}
}
async function netGet(key){
  const u=urlCheie(key); if(!u||typeof fetch!=='function')return null;
  try{const r=await fetch(u,{cache:'no-store'}); syncClock(r); if(!r.ok)return null;
      const j=await r.json(); if(j==null)return null;
      return desfasoara(typeof j==='string'?JSON.parse(j):j);}
  catch(e){return null;}
}

const infasoara=v=>({_e:1,salvatLa:acum(),de:USER||'',data:v});
const desfasoara=o=>(o&&o._e===1)?o:{_e:1,salvatLa:'',de:'',data:o};
async function save(key,val){
  const s=JSON.stringify(infasoara(val));
  let okL=false, okC=false, okN=false;
  try{localStorage.setItem(key,s);okL=true;}catch(e){}
  PENDING++;
  try{
    if(window.storage){try{await window.storage.set(key,s,true);okC=true;}catch(e){console.error(e);}}
    if(SYNC_URL)okN=await netSet(key,s);
  }finally{PENDING--;}
  ST_LOCAL=okL; if(window.storage)ST_CLOUD=okC; if(SYNC_URL)ST_NET=okN;
  if(okN){ /* semnalăm celorlalte calculatoare că e ceva nou de preluat */
    const pl=infasoara(1); PULS_CUNOSCUT=pl.salvatLa;
    netSet('soi-plan2-puls',JSON.stringify(pl));
  }
  arataAutosave();
  if(!okL&&!okC&&!okN)toast('⚠️ NU s-a putut salva — vezi avertismentul roșu de sus');
  else if(SYNC_URL&&!okN)toast('⚠️ Salvat doar pe acest calculator — internetul sau linkul de sincronizare nu răspunde');
}
async function loadSurse(key){
  const out=[];
  try{const s=localStorage.getItem(key); if(s!=null)out.push(desfasoara(JSON.parse(s)));}catch(e){}
  if(window.storage){
    try{const r=await window.storage.get(key,true); if(r&&r.value!=null)out.push(desfasoara(JSON.parse(r.value)));}
    catch(e){}
  }
  if(SYNC_URL){const n=await netGet(key); if(n)out.push(n);}
  out.sort((a,b)=>(a.salvatLa||'')<(b.salvatLa||'')?1:-1); /* cea mai nouă prima */
  return out;
}
async function load(key){const srs=await loadSurse(key);return srs.length?srs[0].data:null;}
/* îmbinare per element: nimic nu se pierde, chiar dacă sursele au istorii diferite */
function acum(){return new Date(Date.now()+CLOCK_OFFSET).toISOString();}
function imbinaListe(surse){
  const m=new Map();
  surse.slice().reverse().forEach(env=>{  /* de la veche la nouă */
    const arr=env&&env.data; if(!Array.isArray(arr))return;
    arr.forEach(it=>{
      if(!it||!it.id)return;
      const ex=m.get(it.id);
      if(!ex||(it.mod_la||'')>=(ex.mod_la||''))m.set(it.id,it);
    });
  });
  return [...m.values()];
}
function imbinaObiect(surse,tombPrefix){
  const baza=Object.assign({},(surse[0]&&surse[0].data&&typeof surse[0].data==='object')?surse[0].data:{});
  surse.slice(1).forEach(env=>{
    const o=env&&env.data; if(!o||typeof o!=='object')return;
    for(const k in o){if(!(k in baza)&&!stersRecent(tombPrefix+k))baza[k]=o[k];}
  });
  /* aplică tombstone-urile: o cheie ștearsă nu rămâne nici dacă acest calculator
     o mai avea în bază — altfel ar re-publica-o la următoarea salvare */
  for(const k in baza){ if(stersRecent(tombPrefix+k)) delete baza[k]; }
  return baza;
}
/* îmbinare specială pentru BIFE: fiecare bifă are timestamp propriu (ts). O
   debifare (tombstone bifa-<k> cu d:1) ȘTERGE bifa DOAR dacă e mai nouă decât
   bifa — altfel o rebifare rămâne, chiar dacă un calculator mai are un tombstone
   vechi de debifare. Rezolvă „bifa nu rămâne tăiată" între dispozitive. */
function imbinaBife(surse){
  const baza={};
  surse.forEach(env=>{ const o=env&&env.data; if(!o||typeof o!=='object')return;
    for(const k in o){ const v=o[k]; if(!v)continue;
      if(!baza[k]||((v.ts||'')>=(baza[k].ts||'')))baza[k]=v; } /* per-cheie, cea mai nouă bifă câștigă */
  });
  for(const k in baza){
    const tb=TOMBS['bifa-'+k], tdel=(tb&&tb.d===1)?(tb.t||''):'';
    if(tdel&&tdel>(baza[k].ts||''))delete baza[k];               /* debifare mai nouă decât bifa (acoperă și bifele vechi fără ts, tdel>'') */
  }
  return baza;
}
/* tombstone-urile se îmbină per-cheie după timp (cel mai nou eveniment câștigă:
   ștergere vs re-adăugare) */
function imbinaTomb(surse){
  const m={};
  surse.forEach(env=>{ const o=env&&env.data; if(!o||typeof o!=='object')return;
    for(const k in o){ const v=o[k]; if(!v)continue; if(!m[k]||((v.t||'')>(m[k].t||'')))m[k]=v; }
  });
  return m;
}
async function saveTomb(){
  const srs=await loadSurse('soi-plan2-tombs');
  TOMBS=imbinaTomb([{salvatLa:acum(),data:TOMBS}].concat(srs));
  return save('soi-plan2-tombs',TOMBS);
}

  if(sCz.length||INCARCAT)CAZURI=imbinaListe([{salvatLa:acum(),data:CAZURI}].concat(sCz));

  if(sEx.length||INCARCAT)EXTRA=imbinaListe([{salvatLa:acum(),data:EXTRA}].concat(sEx));
  const sBf=await loadSurse('soi-plan2-bife');
  if(sBf.length)BIFE=imbinaBife([{salvatLa:acum(),data:BIFE}].concat(sBf));

  if(sOv.length)OVERRIDES=imbinaObiect([{salvatLa:acum(),data:OVERRIDES}].concat(sOv),'ovr-');

  if(sAb.length)ABSENTI=imbinaObiect([{salvatLa:acum(),data:ABSENTI}].concat(sAb),'abs-');
  const sRc=await loadSurse('soi-plan2-rutina-custom');
  if(sRc.length||INCARCAT)RUTINA_CUSTOM=imbinaListe([{salvatLa:acum(),data:RUTINA_CUSTOM}].concat(sRc));
  const sRo=await loadSurse('soi-plan2-rutina-off');
  if(sRo.length)RUTINA_OFF=imbinaObiect([{salvatLa:acum(),data:RUTINA_OFF}].concat(sRo),'roff-');
  const sRov=await loadSurse('soi-plan2-rutina-ovr');
  if(sRov.length)ROVR=imbinaObiect([{salvatLa:acum(),data:ROVR}].concat(sRov),'rovr-');
  INCARCAT=true;
  if(!USER){
    let u=null; try{u=localStorage.getItem('soi-plan2-user');}catch(e){}
    if(!u&&window.storage){try{const r=await window.storage.get('soi-plan2-user');if(r&&r.value)u=r.value;}catch(e){}}
    if(u&&TOTI.indexOf(u)>=0){USER=u;document.getElementById('whoami').value=USER;}
  }
  verificaSarciniNoi(!!silentios);

  pornesteSync();
  autoPreiaZilnic();
}

async function refresh(btn){
  if(btn)btn.textContent='…';
  let n=0; while(PENDING>0&&n++<40)await new Promise(r=>setTimeout(r,100)); /* așteaptă salvările în curs */
  await loadAll();
  if(btn)btn.textContent='🔄 Actualizează';toast('Actualizat ✓');
}
/* sincronizare de fundal: la fiecare minut aduce modificările colegilor, fără să întrerupă editarea */
let PULS_CUNOSCUT='', ULTIMA_INTERACTIUNE=0;
function scrieAcum(){ /* pauzăm doar cât timp cineva chiar tastează într-un câmp de text */
  const a=document.activeElement;
  if(!a)return false;
  if(a.tagName==='TEXTAREA')return true;
  if(a.tagName==='INPUT'&&/^(text|number|date|search|url|tel|email)$/i.test(a.type||'text'))return true;
  return false;
}
async function sincronizeaza(fortat){
  if(PENDING>0||FORM||EDITCAZ||EDITEXTRA||EDITSLOT||EDITCONCEDIU||EDITRUTINA)return;
  if(!fortat&&(scrieAcum()||Date.now()-ULTIMA_INTERACTIUNE<8000))return;
  if(SYNC_URL){
    /* mai întâi un „puls" mic: s-a schimbat ceva de la ultima verificare? */
    const p=await netGet('soi-plan2-puls');
    const t=p?(p.salvatLa||''):'';
    if(!fortat&&t&&t===PULS_CUNOSCUT)return;
    PULS_CUNOSCUT=t;
  }
  await loadAll(false);
}
function pornesteSync(){
  if(SYNC_PORNIT||(!window.storage&&!SYNC_URL))return; SYNC_PORNIT=true;
  if(window.addEventListener){
    window.addEventListener('focus',()=>sincronizeaza(true));
    if(typeof document!=='undefined'&&document.addEventListener)
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)sincronizeaza(true);});
    ['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ULTIMA_INTERACTIUNE=Date.now();},true));
  }
  setInterval(()=>sincronizeaza(false),10000);
}

function vazuteKey(){return 'soi-plan2-vazut-'+slug(USER||'x');}
function citesteVazute(){try{return JSON.parse(localStorage.getItem(vazuteKey())||'[]');}catch(e){return [];}}
function sarciniNoiPentruMine(){
  if(!USER)return [];
  const vaz=citesteVazute();
  return EXTRA.filter(e=>!e.sters&&e.pers===USER&&!BIFE['extra|'+e.id]&&vaz.indexOf(e.id)<0);
}
function marcheazaVazute(){
  if(!USER)return;
  const vaz=citesteVazute();
  EXTRA.filter(e=>e.pers===USER).forEach(e=>{if(vaz.indexOf(e.id)<0)vaz.push(e.id);});
  try{localStorage.setItem(vazuteKey(),JSON.stringify(vaz.slice(-400)));}catch(e){}
}
function cereNotificari(tacut){
  if(!('Notification' in window)){if(!tacut)toast('Browserul nu are notificări');return;}
  if(Notification.permission==='default')Notification.requestPermission().then(()=>render());
  else if(!tacut)toast(Notification.permission==='granted'?'Notificările sunt pornite ✓':'Notificările sunt blocate din setările browserului');
}
function verificaSarciniNoi(cuSunet){
  const noi=sarciniNoiPentruMine().filter(e=>NOTIFICATE.indexOf(e.id)<0);
  if(!noi.length)return;
  noi.forEach(e=>NOTIFICATE.push(e.id));
  if('Notification' in window&&Notification.permission==='granted')
    noi.forEach(e=>{try{new Notification((e.urgent?'🔥 URGENT — ':'')+'📌 Sarcină nouă de la '+(e.by||'un coleg'),{body:e.t+' · pentru '+e.data});}catch(err){}});
  if(cuSunet){sunet();toast('📌 Ai '+noi.length+(noi.length===1?' sarcină nouă':' sarcini noi')+(noi.some(e=>e.urgent)?' — una URGENTĂ!':''));}
}
/* clopoțel discret când primești o sarcină */
function sunet(){
  try{
    const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
    const ctx=new A(), o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.value=.08;
    o.connect(g); g.connect(ctx.destination); o.start();
    o.frequency.setValueAtTime(1175,ctx.currentTime+.12);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.45);
    o.stop(ctx.currentTime+.5);
  }catch(e){}
}

/* ================== RUTINA ZILNICĂ (o dată pe om, indiferent câte cazuri) ================== */
/* bloc: 'd' = 9:00–12:00, 'p' = 12:30–15:30 */
function rutinaBaza(iso){
  const w=dow(iso); if(w<1||w>5)return [];
  const g=[], act=cazIntens(iso);
  /* sarcină generală, o dată pe zi */
  const A=(pers,t,dur,bloc)=>g.push({pers,t,dur,bloc});
  /* sarcină per caz: durata totală se împarte între cazurile active, cu un minim */
  const P=(pers,tpl,durTot,bloc,min)=>{
    if(!act.length)return;
    act.forEach(cz=>{
      const dur=Math.max(min||10,Math.round(durTot/act.length/5)*5);
      g.push({pers,t:tpl.replace('{C}',cz.nume),dur,bloc,cazId:cz.id,caz:cz.nume,zile:cz.zile,ziN:diffDays(cz.start,iso)+1});
    });
  };
  /* postări în grupuri: minimum 5 pe caz, 3 minute bucata */
  const POST=pers=>{
    if(!act.length){A(pers,'15 postări în grupuri Facebook — lotul propriu',45,'p');return;}
    act.forEach(cz=>{
      const q=Math.max(5,Math.round(15/act.length));
      g.push({pers,t:q+' postări în grupuri pentru '+cz.nume,dur:Math.max(15,q*3),bloc:'p',cazId:cz.id,caz:cz.nume,zile:cz.zile,ziN:diffDays(cz.start,iso)+1});
    });
  };

  /* --- ANDREEA: presă & firme calde --- */

  if(w===3||w===4)P('Andreea','Email de mulțumire redacțiilor care au scris despre {C}',40,'d',10);
  A('Andreea','Firme calde din CRM: apeluri și emailuri de follow-up',45,'d');
  POST('Andreea');

  A('Andreea','LinkedIn: prieteni noi țintit + răspuns la comentarii',15,'p');

  A('Andreea','Reactivare donatori: 20 de mesaje personale către donatorii cazurilor anterioare',30,'p');
  A('Andreea','Actualizare CRM după apeluri: etapă, următorul pas, termen',20,'p');
  if(w===3)A('Andreea','Mesaj WhatsApp: anunțul campaniei noi trimis pe liste și contacte',20,'d');
  if(w===5)A('Andreea','Mesaj pe grupul de WhatsApp: rezumatul săptămânii',20,'p');
  if(w===3)A('Andreea','Actualizarea bazei de jurnaliști: cine scrie despre sănătate, ce contact avem',30,'p');
  if(w===5)A('Andreea','Planul de presă pentru săptămâna viitoare: ce cazuri, ce redacții, ce unghi',40,'d');
  if(w===5)A('Andreea','Raportul articolelor obținute săptămâna aceasta + ce a mers',30,'p');

  /* --- PAULA: companii locale --- */
  P('Paula','Telefoane către companii locale din zona cazului {C}',60,'d',20);
  A('Paula','Search 10 companii locale noi + completare CRM',20,'d');
  POST('Paula');
  P('Paula','Search grupuri locale și județene pentru {C} + cerere de intrare',30,'p',10);
  if(w===2)P('Paula','One-pager actualizat pentru {C} către companiile în discuție',60,'p',20);
  A('Paula','LinkedIn: distribuire + interacțiune cu comentariile',15,'p');
  A('Paula','40 de voluntari: trimite postarea zilei — fiecare pe Facebook + 2 grupuri',45,'p');
  if(w===3)A('Paula','Voluntari: apeluri către cei mai activi 5 + recrutare de voluntari noi',30,'d');
  if(w===5)A('Paula','Voluntari: mulțumire pentru săptămâna aceasta + actualizarea listei',20,'p');

  if(w===3)A('Paula','Verificare grupuri: cereri acceptate, reguli, cine e administrator',20,'p');
  if(w===1||w===4)A('Paula','Documente pentru firme: contract de sponsorizare, facturi, adeverințe',30,'p');
  if(w===4)A('Paula','Raport companii: câte contactate, câte au răspuns, câte au alocat',30,'p');

/* ================== PLANUL UNUI CAZ (marginal, doar ce ține de cazul acela) ================== */
function planCaz(cz){
  const N=cz.zile, T=TIERS[N]||TIERS[30], R=cz.resp||'Paula', plan={};
  const add=(d,pers,t,dur,bloc)=>{const k=addDays(cz.start,d-1);(plan[k]=plan[k]||[]).push({pers,t:t.replace('{C}',cz.nume),dur:dur||30,bloc:bloc||'d'});};

  /* ZIUA 1 — preluare & lansare */
  add(1,R,'Predă lui Vlad dosarul medical și verifică pagina cazului pe site',20,'d');
  add(1,R,'Acord scris de la familie (foto/video) + ghidul de postare trimis pe WhatsApp',45,'d');
  add(1,R,'Brief video pentru Gabriel: ce filmăm, cu cine, când — și termenul de livrare',25,'d');
  add(1,'Ștefania','Pachetul vizual de lansare: foto caz, card de start, story',45,'p');
  add(1,R,'Cere lui Andrei scenariile Make pentru caz: postări programate + alerte la praguri',10,'p');
  add(1,'Familia','Postează cazul pe Facebook (profil personal) și îl distribuie prietenilor',0,'p');
  add(1,'Familia','Trimite linkul pe WhatsApp la toate grupurile personale: familie, bloc, colegi',0,'p');
  add(1,'Familia','Face lista celor 20 de oameni care sigur ajută — și îi sună pe rând',0,'p');

  /* ZIUA 2 */
  add(2,R,'Update la 24 de ore: sună familia, adună noutățile, pregătește textul',30,'d');
  add(2,'Familia','Update la 24 de ore de la lansare',0,'p');
  add(2,'Familia','Înscriere în grupurile de Facebook indicate de echipă',0,'p');

  /* ZIUA 3 */
  add(3,R,'Update la 48 de ore + trimiterea cazului pe grupurile locale și județene',45,'d');
  add(3,R,'Alocări de la companii: apeluri de confirmare pentru cazul acesta',45,'d');
  add(3,'Familia','Update campanie la 48 de ore',0,'p');
  add(3,'Familia','Postare pe grupurile locale și județene',0,'p');

  /* COMUNICAT DE PRESĂ */
  const minPR={7:3,15:5,30:7,60:10}[N]||5;
  let prZi=0;
  for(let d=minPR;d<=Math.max(minPR,N-3);d++){if(dow(addDays(cz.start,d-1))===1){prZi=d;break;}}
  if(!prZi)prZi=Math.min(minPR,N);
  add(prZi,'Andreea','Comunicat de presă pentru caz: redactare, trimitere, follow-up telefonic',90,'d');
  add(prZi,'Familia','Postează 3 link-uri media',0,'p');
  for(let k=1;k<=2;k++)if(prZi+k<=N)add(prZi+k,'Familia','5 link-uri media postate',0,'p');

  /* VERIFICARE PRAG 60% */
  const zPrag=Math.max(3,Math.round(N*0.6));
  add(zPrag,R,'⚠️ Prag 60%: semnalează-i lui Vlad unde suntem cu suma',10,'d');
  add(zPrag,R,'Planul B pentru caz: relansare video, val nou de companii, ambasadori',45,'d');

  /* ULTIMELE ZILE */
  if(N>4){
    add(N-2,R,'Cere lui Vlad newsletterul „ultima sută de metri" și lui Gabriel varianta scurtă de final',15,'d');
    add(N-2,'Ștefania','Video de urgență: cât mai lipsește',45,'d');
  }

  /* ZIUA FINALĂ */
  add(N,R,'Confirmă cu Vlad plata către clinică și publicarea ordinelor de plată',15,'d');
  add(N,R,'Cere lui Andrei emailul de mulțumire către toți donatorii campaniei',10,'p');
  add(N,'Ștefania','Carduri de mulțumire pentru companii și donatori',45,'p');
  add(N,R,'Cere lui Gabriel videoclipul de mulțumire pentru companiile care au susținut',10,'d');
  add(N,'Andreea','Mulțumire nominală companiilor care au alocat sume',45,'d');
  add(N,R,'Raportul final al cazului: sume, articole, companii, ce a mers',45,'p');
  add(N,R,'Pregătește debriefingul cazului pentru ședința de vineri',20,'p');

  /* --- CAZ ÎN CONTINUARE: ritm săptămânal, nu zilnic --- */
  if(cz.mod==='intretinere'){
    for(let d=2;d<=N;d++){
      const w=dow(addDays(cz.start,d-1));
      if(w===2){add(d,R,'5 postări în grupuri pentru {C}',15,'p');add(d,R,'Verificare sumă și raportare către Vlad — {C}',10,'d');
        add(d,'Familia','Distribuie cazul în 3 grupuri și trimite 5 mesaje directe',0,'p');}
      if(w===3)add(d,R,'Contact cu familia {C} + lista lor săptămânală pe WhatsApp',20,'d');
      if(w===4){add(d,'Ștefania','Story cu contorul pentru {C}',10,'p');add(d,R,'5 postări în grupuri pentru {C}',15,'p');}
      if(w===5){add(d,R,'Update săptămânal {C}: sumă, noutăți medicale, mulțumiri',25,'p');
        add(d,'Familia','Update pe Facebook + mulțumiri celor care au donat',0,'p');}
    }
    return plan;
  }

  /* RECURENTE ale cazului */
  for(let d=2;d<=N;d++){
    const iso=addDays(cz.start,d-1), w=dow(iso), lucru=(w>=1&&w<=5);

    /* --- FAMILIA: are program zilnic, nu așteaptă --- */
    add(d,'Familia','Distribuie cazul în 5 grupuri în care e înscrisă',0,'p');
    add(d,'Familia','10 mesaje directe către rude, prieteni, colegi — cu linkul campaniei',0,'p');
    add(d,'Familia','Mulțumește nominal, în comentarii, celor care au donat ieri',0,'p');
    if(d%2===0)add(d,'Familia','Filmează un clip scurt cu telefonul: cum e azi, ce urmează',0,'p');
    if(d%T.upd===0)add(d,'Familia','Update pe Facebook: unde suntem cu suma, ce urmează',0,'p');
    if(w===2)add(d,'Familia','Cere anunțul la locul de muncă, la școală sau la biserică',0,'p');
    if(w===4)add(d,'Familia','Contactează 3 firme locale unde are cunoscuți',0,'p');
    if(w===5)add(d,'Familia','Postare de mulțumire după o săptămână încărcată',0,'p');

    /* --- RESPONSABILUL: mobilizează familia, o dată la două zile --- */
    if(lucru&&d%2===1)add(d,R,'Mobilizarea familiei {C}: trimite pe WhatsApp lista pentru următoarele două zile',15,'d');
    if(w===5)add(d,R,'Update sumă pentru caz + text de mulțumire trimis familiei',25,'p');
    if(lucru&&d%2===0)add(d,R,'Contact cu familia: cum stau, ce noutăți avem de comunicat',20,'d');
  }
  return plan;
}

function cazIntens(iso){return cazuriActive(iso).filter(c=>(c.mod||'intens')==='intens');}
function cazIntretinere(iso){return cazuriActive(iso).filter(c=>c.mod==='intretinere');}
function cazuriActive(iso){
  return CAZURI.filter(c=>!c.sters&&!c.gata&&diffDays(c.start,iso)+1>=1&&diffDays(c.start,iso)+1<=c.zile);
}
function sarciniZiBrut(iso){
  const out=[], viitor=(iso>=todayIso());
  cazuriActive(iso).forEach(cz=>{
    const plan=planCaz(cz), d=diffDays(cz.start,iso)+1;
    (plan[iso]||[]).forEach((t,i)=>{
      if(viitor&&t.pers!=='Familia'&&BLOCATI.indexOf(t.pers)>=0)return;
      out.push(Object.assign({},t,{caz:cz.nume,resp:cz.resp,cazId:cz.id,zile:cz.zile,ziN:d,key:cz.id+'|'+iso+'|'+slug(t.pers)+'-'+i}));
    });
  });
  /* praguri atinse, cu videoclipul nefăcut — apar zilnic până sunt bifate */
  if(viitor)cazuriActive(iso).forEach(cz=>{
    [50,75].forEach(x=>{
      const k='prag|'+cz.id+'|'+x;
      if(PRAGURI[cz.id+'|prag'+x]&&!BIFE[k])
        out.push({pers:'Ștefania',t:'🎬 Video '+x+'% pentru '+cz.nume+' — montaj și postare pe TikTok, Facebook și Instagram',dur:60,bloc:'d',caz:cz.nume,cazId:cz.id,zile:cz.zile,ziN:diffDays(cz.start,iso)+1,key:k});
    });
    /* Vlad: card de evoluție + update pe site la fiecare prag atins (25/50/75/100) */
    [25,50,75,100].forEach(x=>{
      const kv='pragv|'+cz.id+'|'+x;
      if(PRAGURI[cz.id+'|prag'+x]&&!BIFE[kv])
        out.push({pers:'Vlad',t:'📊 Card evoluție '+x+'% pentru '+cz.nume+' + update pe site cu pragul atins',dur:20,bloc:'d',caz:cz.nume,cazId:cz.id,zile:cz.zile,ziN:diffDays(cz.start,iso)+1,key:kv});
    });
  });
  /* sarcini date de Vlad */
  EXTRA.filter(e=>!e.sters&&e.data===iso).forEach(e=>{const pr=prioExtra(e);out.push({pers:e.pers,prio:pr,t:(pr==='urg'?'🔥 ':pr==='imp'?'⭐ ':'')+'📌 '+e.t+' — de la '+(e.by||'Vlad'),dur:+e.dur||30,bloc:e.bloc||'d',caz:'',cazId:'extra',zile:0,key:'extra|'+e.id});});
  rutina(iso).forEach(t=>{
    if(viitor&&t.cazId&&BLOCATI.indexOf(t.pers)>=0)return;
    out.push(Object.assign({caz:'',cazId:'gen',zile:0},t,{key:'rut|'+iso+'|'+slug(t.pers)+'|'+(t.cazId&&t.cazId!=='gen'?t.cazId+'|':'')+slug(t.t).slice(0,44)}));
  });
  /* concediu: sarcinile unei responsabile absente merg la celelalte responsabile;
     ale unui absent fără înlocuitor (ex. coordonator) se ascund cât e plecat */
  const subs=RESPONSABILI.filter(r=>!esteAbsent(r,iso));
  out.forEach(t=>{
    if(t.pers==='Familia'||!esteAbsent(t.pers,iso))return;
    if(RESPONSABILI.indexOf(t.pers)>=0&&subs.length){t.inlocuit=t.pers;t.pers=subs[Math.abs(hashStr(t.key))%subs.length];}
  });
  /* strat de suprascriere per zi (anulare/editare) + ascunderea celor rămași absenți */
  return out.filter(t=>{
    if(esteAbsent(t.pers,iso)&&t.pers!=='Familia')return false;
    let o=OVERRIDES[t.key];
    if(isRutKey(t.key)){const po=ROVR[rovrKey(t.key)]; if(po)o=po;} /* rutina: permanent > per-zi */
    if(o&&o.sters)return false;
    if(o){if(o.t!=null)t.t=o.t;if(typeof o.dur==='number'&&o.dur>0)t.dur=o.dur;t.editat=true;}
    return true;
  });
}
/* programul de 5 ore: alegem ce încape în zi, în ordinea urgenței; restul nu se programează */
function alegePentruZi(iso){
  const all=sarciniZiBrut(iso), chei=new Set(), taiate=[];
  const pers=[...new Set(all.map(t=>t.pers))];
  pers.forEach(p=>{
    const ale=all.filter(t=>t.pers===p);
    const fix=t=>t.cazId==='gen'||t.cazId==='extra'||t.pers==='Familia'||String(t.key).indexOf('prag|')===0;
    const fixe=ale.filter(fix), rest=ale.filter(t=>!fix(t));
    fixe.forEach(t=>chei.add(t.key));
    let buget=PROGRAM_MAX-fixe.reduce((s,t)=>s+t.dur,0);
    const pri=t=>(t.zile&&TIERS[t.zile])?TIERS[t.zile].pr:5;
    rest.sort((a,b)=>pri(a)-pri(b)||b.dur-a.dur);
    rest.forEach(t=>{if(t.dur<=buget){chei.add(t.key);buget-=t.dur;}else taiate.push(t);});
  });
  return {chei,taiate};
}
function sarciniZi(iso){const sel=alegePentruZi(iso).chei;return sarciniZiBrut(iso).filter(t=>sel.has(t.key));}

/* ================== ÎMPACHETARE PE ORE, PE DOUĂ BLOCURI ================== */
function orarPers(iso,pers){
  const all=sarciniZi(iso).filter(t=>t.pers===pers);
  const pri=t=>t.zile?TIERS[t.zile].pr:(t.prio==='urg'?0:t.prio==='imp'?1:5);
  const srt=(a,b)=>pri(a)-pri(b)||b.dur-a.dur;
  const dim=all.filter(t=>t.bloc==='d').sort(srt), dupa=all.filter(t=>t.bloc!=='d').sort(srt);
  const rez=[],over=[];
  const pune=(lista,bloc,spill)=>{
    let cur=bloc[0];
    lista.forEach(t=>{
      if(cur+t.dur<=bloc[1]){rez.push(Object.assign({},t,{de:cur,la:cur+t.dur}));cur+=t.dur;}
      else spill.push(t);
    });
    return cur;
  };
  const spillD=[],spillP=[],B1=bloc1For(iso);
  pune(dim,B1,spillD);
  let cur2=pune(dupa.concat(spillD).sort(srt),BLOC2,spillP);
  /* ce n-a încăput după-amiaza încearcă în golul rămas dimineața */
  let curD=rez.filter(t=>t.de<MASA[0]).reduce((m,t)=>Math.max(m,t.la),B1[0]);
  spillP.forEach(t=>{
    if(curD+t.dur<=B1[1]){rez.push(Object.assign({},t,{de:curD,la:curD+t.dur}));curD+=t.dur;}
    else over.push(t);
  });
  /* golurile rămase se umplu cu muncă utilă, nu se lasă albe */
  const sugestie=(pers,iso,idx)=>{
    const nr=(RESTP&&RESTP[pers])||0;
    if(nr>0)return 'Recuperează din restanțe — mai ai '+nr+' de bifat';
    const L=FLEX[pers]||[]; if(!L.length)return 'Timp de lucru liber';
    const z=Math.floor(new Date(iso+'T12:00:00')/864e5);
    return L[(z+idx)%L.length];
  };
  const flexSlot=(de,la,idx)=>({pers,t:sugestie(pers,iso,idx),dur:la-de,bloc:idx?'p':'d',de,la,flex:true,caz:'',cazId:'flex',zile:0,key:'flex|'+iso+'|'+slug(pers)+'|'+idx});
  let capD=rez.filter(t=>t.de<MASA[0]).reduce((m,t)=>Math.max(m,t.la),B1[0]);
  if(B1[1]-capD>=15)rez.push(flexSlot(capD,B1[1],0));
  let capP=rez.filter(t=>t.de>=BLOC2[0]).reduce((m,t)=>Math.max(m,t.la),BLOC2[0]);
  /* ultimul sfert de oră din zi = planificarea zilei de mâine: urgent, apoi important */
  const URG=Math.min(25,BLOC2[1]-capP), urgDe=BLOC2[1]-(URG>0?URG:0);
  if(urgDe-capP>=15)rez.push(flexSlot(capP,urgDe,1)); /* golul dinaintea planificării → timp liber */
  if(URG>=10){
    const maine=ziuaLucrUrm(iso);
    const nUI=EXTRA.filter(e=>!e.sters&&e.pers===pers&&e.data===maine&&(prioExtra(e)==='urg'||prioExtra(e)==='imp')).length;
    rez.push({pers:pers,t:'⚡ Planifică mâine — alege/scrie ce faci la prima oră (urgent, apoi important)'+(nUI?' · '+nUI+' pregătite':''),dur:BLOC2[1]-urgDe,bloc:'p',de:urgDe,la:BLOC2[1],urgblock:true,maine:maine,caz:'',cazId:'urg',zile:0,key:'urg|'+iso+'|'+slug(pers)});
  }
  rez.sort((a,b)=>a.de-b.de);
  const incarcare=all.reduce((s,t)=>s+t.dur,0);
  return {rez,over,incarcare};
}
function incarcareZi(iso,pers){return orarPers(iso,pers).incarcare;}

/* ================== BIFE & RESTANȚE ================== */
function tick(key,on,box){
  if(!USER){alert('Alege-ți numele din dreapta sus.');box.checked=!on;return;}
  if(on){BIFE[key]={by:USER,at:new Date().toLocaleString('ro-RO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),ts:acum()};revine('bifa-'+key);}
  else{delete BIFE[key];marcheazaSters('bifa-'+key);}
  saveBife();render();toast(on?'Bifat ✓':'Debifat');
}
function restante(){
  const azi=todayIso(),out=[],selC={};
  /* se păstrează doar restanțele din ziua lucrătoare anterioară — tot ce e mai vechi de 48 de ore dispare singur */
  let lim=addDays(azi,-1);while(dow(lim)===0||dow(lim)===6)lim=addDays(lim,-1);
  const selFor=iso=>selC[iso]||(selC[iso]=alegePentruZi(iso).chei);
  CAZURI.filter(c=>!c.sters&&!c.gata).forEach(cz=>{
    const plan=planCaz(cz);
    Object.keys(plan).sort().forEach(iso=>{
      if(iso>=azi||iso<lim)return;
      plan[iso].forEach((t,i)=>{
        const key=cz.id+'|'+iso+'|'+slug(t.pers)+'-'+i;
        /* sarcinile care n-au intrat în programul de 5 ore al zilei nu devin restanțe */
        if(!BIFE[key]&&selFor(iso).has(key))out.push(Object.assign({},t,{iso,caz:cz.nume,zile:cz.zile,key}));
      });
    });
  });
  out.sort((a,b)=>a.iso<b.iso?-1:1);
  return out;
}

    +'<button class="btn small" onclick="setZi(\''+todayIso()+'\')">Azi</button>'

  else if(VIEW==='caz')tr.innerHTML='<button class="btn primary" onclick="FORM=!FORM;render()">➕ Caz nou</button><button class="btn" onclick="refresh(this)">🔄 Actualizează</button>';
  else tr.innerHTML='<button class="btn" onclick="refresh(this)">🔄 Actualizează</button>';
  tr.innerHTML+='<button class="btn small" onclick="SETARI=!SETARI;render()" title="Sincronizare între calculatoare">⚙️</button>'
    +'<span class="mini" id="autosv" style="'+((ST_LOCAL||ST_CLOUD||ST_NET||!TESTAT)?'':'color:var(--red-deep);font-weight:700')+'">'+stareText()+'</span><span style="flex:1"></span>'
    +'<button class="btn small" onclick="salveazaProiect()" title="Descarcă o copie de siguranță — datele se salvează oricum automat, la fiecare modificare">💾 Copie de siguranță</button>'
    +'<button class="btn small" onclick="document.getElementById(\'fisier\').click()">📂 Încarcă</button>'
    +'<button class="btn small" onclick="raportPdf()">📄 Raport PDF</button>'
    +'<button class="btn small" onclick="raportWord()">📄 Word</button>';
  const o=document.getElementById('out');
  const eb=document.getElementById('extrabdg');
  const viit=USER?EXTRA.filter(e=>!e.sters&&e.pers===USER&&!BIFE['extra|'+e.id]).length
                 :EXTRA.filter(e=>!e.sters&&e.data>=todayIso()&&!BIFE['extra|'+e.id]).length;
  eb.textContent=viit;eb.style.display=viit?'inline-block':'none';
  o.innerHTML=(SETARI?randSetari():'')+(VIEW==='zi'?randZi():VIEW==='caz'?randCazuri():VIEW==='final'?randFinalizate():VIEW==='rest'?randRestante():VIEW==='extra'?randExtra():randFise());
}

async function setSyncUrl(){
  const v=(document.getElementById('sync_url').value||'').trim();
  try{localStorage.setItem('soi-plan2-sync-url',v);}catch(e){}
  SYNC_URL=v;
  const el=document.getElementById('sync_msg');
  if(!v){ST_NET=false;if(el)el.textContent='Sincronizarea prin internet e oprită — se salvează doar pe acest calculator.';arataAutosave();return;}
  if(el)el.textContent='Se testează linkul…';
  const ok=await netSet('soi-plan2-test',JSON.stringify(infasoara('1')));
  ST_NET=ok;
  if(ok){
    toast('🌐 Conectat — se aduc datele echipei…');
    await loadAll();
    pornesteSync();
    SETARI=true;render();
    toast('🌐 Sincronizarea funcționează ✓');
  }else{
    if(el)el.innerHTML='<b style="color:var(--red-deep)">❌ Linkul nu răspunde.</b> Verifică: începe cu https://, se termină cu numele nodului (fără .json), iar regulile din Firebase sunt publicate exact pentru acel nume.';
    arataAutosave();
  }
}

function randZi(){

  /* Gabriel/Andrei nu văd grila/agendele fetelor; fetele nu văd sarcinile lui Gabriel/Andrei. Vlad vede tot. */
  const euExtern=eExtern(USER), euFata=eFata(USER);

    h+='<div class="grid">'+ECHIPA.map(p=>{
      const {rez,over,incarcare}=orarPers(ZI,p), tot=rez.length+over.length;

        +(b?'<span class="byline">✓ '+esc(b.by)+' · '+b.at+'</span>':'')+'</div></div>';});

    else if(euFata && eExtern(FILTRU)) cine=[USER].concat(FETELE.filter(p=>p!==USER));
    else cine=[FILTRU];

    cine=[USER]; /* Gabriel/Andrei: doar agenda proprie, fără fete */

      h+='<div class="card" style="opacity:.8"><div class="chead"><b>'+p+'</b><span class="sub">'+(ROL[p]||'')+'</span><span class="right">'+concBtn+' '+rutBtn+'</span></div>'

    const {rez,over,incarcare}=orarPers(ZI,p);

      h+='<div class="slot '+(b?'done':'')+(t.flex?' flex':'')+'"'+(t.urgblock?' style="border-left:4px solid var(--red-deep);background:var(--red-soft)"':'')+'><div class="hh">'+hhmm(t.de)+'–'+hhmm(t.la)+'</div>'
        +'<input type="checkbox" '+(b?'checked':'')+' onchange="tick(\''+t.key+'\',this.checked,this)">'
        +'<div class="bd">'+(t.urgblock?'':(t.flex?'<span class="tag tflex">timp liber</span>':tagCaz(t)))+esc(t.t)+(t.inlocuit?' <span class="tag" style="background:var(--teal-soft);color:var(--teal)">preluat de la '+esc(t.inlocuit)+'</span>':'')+(t.editat?' <span class="mini">· modificată</span>':'')+(b?'<span class="byline">✓ '+esc(b.by)+' · '+b.at+'</span>':'')+'</div>'

  const fam=sarciniZi(ZI).filter(t=>t.pers==='Familia');

    cazuriActive(ZI).forEach(cz=>{

      h+='</div>';

  return h;

function setSuma(id,val,auto){

  if(auto && nou < (c.strans||0)) return;

/* ============ PRELUAREA SUMELOR DE PE SITE ============ */
function numarSuma(x){
  if(x==null||x==='')return null;
  const v=Math.round(parseFloat(String(x).replace(/[^0-9,\.]/g,'').replace(/\./g,'').replace(',','.')));
  return isFinite(v)&&v>0?v:null;
}
async function iaText(u,ms){
  const opts={cache:'no-store'};
  let ctrl=null;
  if(typeof AbortController==='function'){ctrl=new AbortController();opts.signal=ctrl.signal;setTimeout(()=>{try{ctrl.abort();}catch(e){}},ms||12000);}
  const r=await fetch(u,opts);
  if(!r||!r.ok)return null;
  return await r.text();
}
async function preiaSume(url,cazId){
  if(typeof fetch!=='function')return null;
  /* 1. releul propriu al asociației (Make): extrage sumele el însuși și răspunde cu ele */
  try{
    const t=await iaText('https://hook.eu1.make.com/itcilr7k2cbofioivbsop3t9xkt8t3xe?caz='+encodeURIComponent(cazId||'')+'&url='+encodeURIComponent(url),20000);
    if(t){try{const j=JSON.parse(t);const rez={strans:numarSuma(j.strans),tinta:numarSuma(j.tinta)};if(rez.strans!=null)return rez;}catch(e){}}
  }catch(e){}
  /* 2. releul scrie oricum rezultatul și în Firebase — canalul care sigur funcționează */
  if(cazId&&SYNC_URL){
    try{
      await new Promise(rz=>setTimeout(rz,1500));
      const t=await iaText(urlCheie('soi-plan2-sume-site/'+cazId),12000);
      if(t){const j=JSON.parse(t);
        if(j&&j.la&&(Date.now()/1000-(+j.la))<300){
          const rez={strans:numarSuma(j.strans),tinta:numarSuma(j.tinta)};
          if(rez.strans!=null)return rez;
        }}
    }catch(e){}
  }
  /* 3. rezervă: citire directă + servicii publice, cu extragere locală */
  const cai=[url,
    'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
    'https://corsproxy.io/?url='+encodeURIComponent(url)];
  for(const u of cai){
    try{const t=await iaText(u,12000);
        if(t){const rez=extrageSume(t);if(rez.strans!=null)return rez;}}
    catch(e){}
  }
  return null;
}
function extrageSume(html){
  /* pe site simbolul euro e scris ca &euro; in codul paginii, nu ca semnul in sine */
  const txt=String(html).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ');
  const EU='(?:\u20ac|&euro;|&#8364;|EUR)';
  const st=txt.match(new RegExp('(?:Suma\\s+primit[a\u0103]|Amount\\s+received)[\\s\\S]{0,600}?(\\d[\\d.,]*)\\s*'+EU,'i'));
  const nc=txt.match(new RegExp('(?:Necesari|Needed)[\\s\\S]{0,600}?(\\d[\\d.,]*)\\s*'+EU,'i'));
  return {strans:st?numarSuma(st[1]):null,tinta:nc?numarSuma(nc[1]):null};
}
async function preiaSuma(id,btn,tacut){
  const c=CAZURI.find(x=>x.id===id); if(!c)return false;
  if(!c.link){if(!tacut)toast('Adaugă întâi linkul cazului la ✏️ Editează');return false;}
  if(btn)btn.textContent='…';
  const r=await preiaSume(c.link,c.id);
  if(btn)btn.textContent='⟳ Preia de pe site';
  if(!r){if(!tacut)toast('❌ Nu am putut citi suma de pe pagina '+c.nume+' — verifică linkul și internetul');return false;}
  if(r.tinta)c.tinta=r.tinta;
  setSuma(id,r.strans,true);   // auto: nu scade suma corectată manual
  return true;
}
async function preiaToate(btn){
  const cu=CAZURI.filter(c=>!c.sters&&!c.gata&&c.link);
  if(!cu.length){toast('Niciun caz activ nu are încă linkul de pe site (se pune la ✏️ Editează)');return;}
  if(btn){btn.disabled=true;btn.textContent='Se preiau sumele…';}
  let ok=0; const esuate=[];
  for(const c of cu){if(await preiaSuma(c.id,null,true))ok++; else esuate.push(c.nume);}
  if(btn){btn.disabled=false;btn.textContent='⟳ Preia sumele de pe site';}
  toast(esuate.length?('Preluate '+ok+' din '+cu.length+'. Nu am reușit la: '+esuate.join(', ')+' — verifică linkurile lor.')
                     :('Sume preluate de pe site: '+ok+' din '+cu.length+' cazuri ✓'));
}
/* o dată pe zi, sumele se aduc singure de pe site — o singură dată pe toată echipa,
   nu pe fiecare calculator (data ultimei preluări e păstrată în baza comună) */
async function autoPreiaZilnic(){
  if(typeof fetch!=='function')return;
  if(!CAZURI.some(c=>!c.sters&&!c.gata&&c.link))return;
  try{
    const ult=await load('soi-plan2-suma-auto');
    if(ult===todayIso())return;
    await save('soi-plan2-suma-auto',todayIso());
  }catch(e){return;}
  setTimeout(()=>preiaToate(null),2500);
}
function togglePrag(k){if(PRAGURI[k]){delete PRAGURI[k];marcheazaSters('prag-'+k);}else{PRAGURI[k]={by:USER||'?',at:todayIso()};revine('prag-'+k);}savePrag();render();}
/* Concediu pe perioade: ABSENTI[p] = listă de {de, pana}. E absent într-o zi
   dacă acea zi cade în vreo perioadă — se activează singur în intervalul ales. */
function esteAbsent(p,iso){const r=ABSENTI[p];if(!Array.isArray(r))return false;iso=iso||ZI;return r.some(x=>x&&x.de&&x.pana&&iso>=x.de&&iso<=x.pana);}
function editConcediu(p){EDITCONCEDIU=EDITCONCEDIU===p?'':p;render();}
function adaugaConcediu(p,sl){
  const de=(document.getElementById('conc_de_'+sl)||{}).value||'', pana=(document.getElementById('conc_pana_'+sl)||{}).value||'';
  if(!de||!pana){alert('Alege ambele date: de la și până la.');return;}
  if(pana<de){alert('„Până la" nu poate fi înainte de „de la".');return;}
  if(!Array.isArray(ABSENTI[p]))ABSENTI[p]=[];
  ABSENTI[p].push({de:de,pana:pana,by:USER||'?',at:todayIso()});
  revine('abs-'+p);
  saveAbsenti();render();toast('Concediu '+esc(p)+': '+de+' → '+pana);
}
function stergeConcediu(p,idx){
  if(!Array.isArray(ABSENTI[p]))return;
  ABSENTI[p].splice(idx,1);
  if(!ABSENTI[p].length){delete ABSENTI[p];marcheazaSters('abs-'+p);}
  saveAbsenti();render();toast('Perioadă de concediu ștearsă');
}
function randConcediu(p){
  const sl=slug(p), r=Array.isArray(ABSENTI[p])?ABSENTI[p]:[];
  let h='<div class="card" style="border-color:var(--teal)"><div class="chead"><b>🏖 Concediu — '+esc(p)+'</b><span class="right"><button class="btn small" onclick="editConcediu(\''+p+'\')">Închide</button></span></div>';
  if(r.length)h+=r.map((x,i)=>'<div class="slot"><div class="bd">'+fmtZi(x.de)+' → '+fmtZi(x.pana)+((ZI>=x.de&&ZI<=x.pana)?' <span class="tag" style="background:var(--teal-soft);color:var(--teal)">activ acum</span>':'')+'</div><button class="btn small" onclick="stergeConcediu(\''+p+'\','+i+')" title="Șterge perioada">✕</button></div>').join('');
  else h+='<div class="mini" style="padding:6px 2px">Nicio perioadă de concediu setată.</div>';
  h+='<div class="frow" style="border:none"><label>De la</label><input type="date" id="conc_de_'+sl+'">'
   +'<label>Până la</label><input type="date" id="conc_pana_'+sl+'">'
   +'<button class="btn small" onclick="adaugaConcediu(\''+p+'\',\''+sl+'\')">➕ Adaugă concediu</button></div></div>';
  return h;
}

/* ===== EDITOR DE RUTINĂ (sarcini recurente proprii + ascunderea celor standard) ===== */
function editRutina(p){EDITRUTINA=EDITRUTINA===p?'':p;render();}
function adaugaRutina(p,sl){
  const t=((document.getElementById('rt_text_'+sl)||{}).value||'').trim();
  if(!t){alert('Scrie sarcina recurentă.');return;}
  const dur=+((document.getElementById('rt_dur_'+sl)||{}).value)||20;
  const bloc=(document.getElementById('rt_bloc_'+sl)||{}).value||'d';
  const prio=(document.getElementById('rt_prio_'+sl)||{}).value||'';
  const zile=[].slice.call(document.querySelectorAll('.rt_zi_'+sl)).filter(c=>c.checked).map(c=>+c.value);
  if(!zile.length){alert('Alege cel puțin o zi.');return;}
  RUTINA_CUSTOM.push({id:uid(),pers:p,t:t,dur:dur,bloc:bloc,prio:prio,zile:zile,mod_la:acum()});
  saveRutinaCustom();render();toast('Adăugat în rutină ✓');
}
function stergeRutina(id){const r=RUTINA_CUSTOM.find(x=>x.id===id);if(r){r.sters=true;r.mod_la=acum();}saveRutinaCustom();render();toast('Șters din rutină');}
function resetRovr(pk){delete ROVR[pk];marcheazaSters('rovr-'+pk);saveRovr();render();toast('Readusă la normal ✓');}
function toggleRutinaStd(p,ts){const k=slug(p)+'|'+ts;if(RUTINA_OFF[k]){delete RUTINA_OFF[k];marcheazaSters('roff-'+k);}else{RUTINA_OFF[k]={at:todayIso()};revine('roff-'+k);}saveRutinaOff();render();}
function randRutinaEditor(p){
  const sl=slug(p), zn={1:'Lu',2:'Ma',3:'Mi',4:'Jo',5:'Vi'};
  const mele=RUTINA_CUSTOM.filter(r=>!r.sters&&r.pers===p);
  let h='<div class="card" style="border-color:var(--blue)"><div class="chead"><b>🔁 Rutina — '+esc(p)+'</b><span class="right"><button class="btn small" onclick="editRutina(\''+p+'\')">Închide</button></span></div>';
  h+='<div class="mini" style="font-weight:600;margin-top:4px">Sarcinile tale recurente adăugate:</div>';
  if(mele.length)h+=mele.map(r=>'<div class="slot"><div class="bd">'+(r.prio==='urg'?'🔥 ':r.prio==='imp'?'⭐ ':'')+esc(r.t)+' <span class="mini">· '+(+r.dur||20)+' min · '+(r.bloc==='p'?'după-amiaza':'dimineața')+' · '+(r.zile||[]).map(z=>zn[z]).join(' ')+'</span></div><button class="btn small" onclick="stergeRutina(\''+r.id+'\')" title="Șterge">✕</button></div>').join('');
  else h+='<div class="mini" style="padding:4px 2px">Niciuna încă — adaugă mai jos.</div>';
  h+='<div class="frow" style="border:none;margin-top:6px"><input type="text" id="rt_text_'+sl+'" placeholder="Sarcină recurentă nouă" style="flex:1;min-width:190px">'
   +'<label>Durata</label><select id="rt_dur_'+sl+'">'+[10,15,20,30,45,60].map(d=>'<option value="'+d+'"'+(d===20?' selected':'')+'>'+d+' min</option>').join('')+'</select>'
   +'<select id="rt_bloc_'+sl+'"><option value="d">dimineața</option><option value="p">după-amiaza</option></select>'
   +'<select id="rt_prio_'+sl+'"><option value="">normală</option><option value="imp">⭐ importantă</option><option value="urg">🔥 urgentă</option></select></div>';
  h+='<div class="frow" style="border:none"><label>Zile:</label>'
   +[1,2,3,4,5].map(z=>'<label style="font-weight:400;margin-right:6px"><input type="checkbox" class="rt_zi_'+sl+'" value="'+z+'" checked> '+zn[z]+'</label>').join('')
   +'<button class="btn primary small" onclick="adaugaRutina(\''+p+'\',\''+sl+'\')">➕ Adaugă în rutină</button></div>';
  const baza=rutinaBaza(ZI).filter(t=>t.pers===p), seen={};
  const std=baza.filter(t=>{const k=slug(p)+'|'+slug(t.t);if(seen[k])return false;seen[k]=1;return true;});
  if(std.length){
    h+='<div class="mini" style="font-weight:600;margin-top:8px">Sarcini standard (din șablon) — ascunde ce nu se aplică ție:</div>';
    std.forEach(t=>{const ts=slug(t.t),k=slug(p)+'|'+ts,hidden=!!RUTINA_OFF[k];
      h+='<div class="slot" style="'+(hidden?'opacity:.5':'')+'"><div class="bd">'+esc(t.t)+(hidden?' <span class="mini">(ascunsă)</span>':'')+'</div><button class="btn small" onclick="toggleRutinaStd(\''+p+'\',\''+ts+'\')">'+(hidden?'↩ Arată':'Ascunde')+'</button></div>';});
  }
  /* sarcini tăiate/modificate permanent de pe rând (✏️/✕) — readu la normal */
  const rov=Object.keys(ROVR).map(k=>ROVR[k]?Object.assign({_k:k},ROVR[k]):null).filter(x=>x&&x.pers===p&&(x.sters||x.t!=null));
  if(rov.length){
    h+='<div class="mini" style="font-weight:600;margin-top:8px">Sarcini tăiate/modificate de tine (permanent) — readu la normal:</div>';
    rov.forEach(r=>{h+='<div class="slot"><div class="bd">'+esc(r.orig||r.t||r._k)+' <span class="mini">· '+(r.sters?'tăiată':'→ „'+esc(r.t||'')+'", '+(+r.dur||0)+' min')+'</span></div><button class="btn small" onclick="resetRovr(\''+r._k+'\')">↩ Readu</button></div>';});
  }
  h+='</div>';
  return h;
}

/* Prioritatea unei sarcini ad-hoc: '' normală · 'imp' importantă · 'urg' urgentă.
   Compat cu vechiul câmp boolean „urgent". */
function prioExtra(e){return (e&&e.prio)||(e&&e.urgent?'urg':'');}
/* Câmpurile unei sarcini ad-hoc — reutilizate la „dă o sarcină" și la editare. */
function campuriExtra(pfx,v){
  v=v||{};
  const durs=[15,30,45,60,120], durL={15:'15 min',30:'30 min',45:'45 min',60:'1 oră',120:'2 ore'};
  return '<div class="frow">'
   +'<label>Cine</label><select id="'+pfx+'pers">'+TOTI.map(p=>'<option'+(p===v.pers?' selected':'')+'>'+p+'</option>').join('')+'</select>'
   +'<label>Când</label><input type="date" id="'+pfx+'data" value="'+esc(v.data||todayIso())+'">'
   +'<label>Durata</label><select id="'+pfx+'dur">'+durs.map(d=>'<option value="'+d+'"'+((+v.dur||30)===d?' selected':'')+'>'+durL[d]+'</option>').join('')+'</select>'
   +'<label>Când în zi</label><select id="'+pfx+'bloc"><option value="d"'+(v.bloc!=='p'?' selected':'')+'>dimineața</option><option value="p"'+(v.bloc==='p'?' selected':'')+'>după-amiaza</option></select></div>'
   +'<div class="frow"><input type="text" id="'+pfx+'text" placeholder="Ce are de făcut" value="'+esc(v.t||'')+'" style="flex:1;min-width:220px">'
   +'<label>Prioritate</label><select id="'+pfx+'prio">'
   +'<option value=""'+(prioExtra(v)===''?' selected':'')+'>normală</option>'
   +'<option value="imp"'+(prioExtra(v)==='imp'?' selected':'')+'>⭐ importantă</option>'
   +'<option value="urg"'+(prioExtra(v)==='urg'?' selected':'')+'>🔥 urgentă</option></select></div>';
}
function citesteCampuriExtra(pfx){

    prio:(document.getElementById(pfx+'prio')||{}).value||'',
    urgent:((document.getElementById(pfx+'prio')||{}).value||'')==='urg'};
}

function randListaExtra(titlu,lista){

function randExtra(){
  const potiNotifica='Notification' in window;
  let h='<div class="info">Oricine poate da o sarcină oricui — Andreea către Paula, Paula către Ștefania, oricare către Vlad, Gabriel sau Andrei. Sarcina apare în ziua aleasă direct în agenda persoanei, marcată cu 📌, iar colegul e anunțat chiar aici, în program: banner mov + sunet'
   +(potiNotifica?' + notificare de browser dacă are pagina deschisă':'')

    h+='<div class="warn">🔔 Ca să primești notificări pe acest calculator când ți se dă o sarcină, pornește-le o singură dată: '
     +'<button class="btn small" onclick="cereNotificari()">Pornește notificările</button></div>';
  h+='<div class="card"><div class="chead"><b>Dă o sarcină</b>'+(USER?'<span class="sub">trimisă de '+esc(USER)+'</span>':'<span class="sub" style="color:var(--red-deep)">alege-ți numele din dreapta sus</span>')+'</div>'
   +campuriExtra('e_',{})
   +'<div class="frow"><label>Repetă</label><select id="e_rep"><option value="">o singură dată</option><option value="zi">în fiecare zi</option><option value="sapt">în fiecare săptămână</option></select>'
   +'<label>Până la</label><input type="date" id="e_pana" value="">'

  const active=EXTRA.filter(e=>!e.sters);
  if(!active.length)return h+'<div class="empty">Nicio sarcină dată deocamdată.</div>';
  const cmp=(a,b)=>a.data<b.data?1:-1;
  if(USER){
    h+=randListaExtra('📥 Primite de mine',active.filter(e=>e.pers===USER).sort(cmp));
    h+=randListaExtra('📤 Trimise de mine',active.filter(e=>e.by===USER&&e.pers!==USER).sort(cmp));
    h+=randListaExtra('👥 Restul echipei',active.filter(e=>e.pers!==USER&&e.by!==USER).sort(cmp));
  }else{
    h+=randListaExtra('Sarcini trimise',active.sort(cmp));

function adaugaExtra(){
  const d=citesteCampuriExtra('e_');
  if(!d.t){alert('Scrie ce are de făcut.');return;}
  const rep=(document.getElementById('e_rep')||{}).value||'';
  const pana=(document.getElementById('e_pana')||{}).value||'';
  const date=[d.data];
  if(rep&&pana&&pana>=d.data){
    const step=rep==='sapt'?7:1; let cur=addDays(d.data,step), n=1;
    while(cur<=pana&&n<60){date.push(cur);cur=addDays(cur,step);n++;}
  }
  const serie=date.length>1?uid():'';
  date.forEach(dt=>{EXTRA.push({id:uid(),pers:d.pers,data:dt,t:d.t,dur:d.dur,bloc:d.bloc,prio:d.prio,urgent:d.urgent,by:USER||'?',serie:serie,cand:todayIso(),mod_la:acum()});});
  saveExtra();EDITEXTRA='';render();
  toast(date.length>1?('Serie de '+date.length+' sarcini trimisă ✓ — '+d.pers):('Sarcină trimisă ✓ — '+d.pers+' o primește în câteva secunde'));
}
function editExtra(id){EDITEXTRA=EDITEXTRA===id?'':id;render();}
function salveazaExtra(id){
  const e=EXTRA.find(x=>x.id===id);if(!e)return;
  const d=citesteCampuriExtra('ed_');
  if(!d.t){alert('Scrie ce are de făcut.');return;}
  e.pers=d.pers;e.data=d.data;e.t=d.t;e.dur=d.dur;e.bloc=d.bloc;e.prio=d.prio;e.urgent=d.urgent;e.mod_la=acum();
  saveExtra();EDITEXTRA='';render();toast('Sarcină modificată ✓');
}
function stergeExtra(id){if(!confirm('Ștergi sarcina?'))return;const e=EXTRA.find(x=>x.id===id);if(e){e.sters=true;e.mod_la=acum();}saveExtra();EDITEXTRA='';render();}
function stergeSerieExtra(serie){if(!serie||!confirm('Ștergi toate sarcinile din această serie?'))return;let n=0;EXTRA.forEach(e=>{if(e.serie===serie&&!e.sters){e.sters=true;e.mod_la=acum();n++;}});saveExtra();EDITEXTRA='';render();toast('Serie ștearsă ('+n+') ✓');}

/* ===== EDITAREA ORICĂREI SARCINI DIN ZI (generate sau ad-hoc) ===== */
/* Sarcinile ad-hoc se editează în formularul lor din „Sarcini". Cele generate
   de motor se anulează/înlocuiesc printr-un strat de suprascriere pe ziua aceea. */
function editSlot(key){
  if(String(key).indexOf('extra|')===0){setView('extra');EDITEXTRA=String(key).slice(6);render();toast('Editează sarcina în „Sarcini"');return;}
  EDITSLOT=EDITSLOT===key?'':key;render();
}
/* pentru o cheie de rutină: cheia permanentă (pers|titlu) + persoana + titlul ORIGINAL */
function pkInfo(key){
  const pk=rovrKey(key); let pers='', orig='';
  const m=rutina(ZI).find(x=>(slug(x.pers)+'|'+(x.cazId&&x.cazId!=='gen'?x.cazId+'|':'')+slug(x.t).slice(0,44))===pk);
  if(m){pers=m.pers;orig=m.t;}
  return {pk:pk,pers:pers,orig:orig};
}
function anuleazaSlot(key){
  if(String(key).indexOf('extra|')===0){
    if(!confirm('Anulezi această sarcină din ziua de azi?'))return;
    const e=EXTRA.find(x=>x.id===String(key).slice(6));if(e){e.sters=true;e.mod_la=acum();}saveExtra();
    EDITSLOT='';render();toast('Sarcină anulată');return;
  }
  if(isRutKey(key)){
    if(!confirm('Scoți această sarcină din rutină? Nu va mai apărea în zilele următoare. O poți readuce oricând din „🔁 Rutină".'))return;
    const i=pkInfo(key);
    ROVR[i.pk]=Object.assign({pers:i.pers,orig:i.orig},ROVR[i.pk],{sters:true});
    revine('rovr-'+i.pk);saveRovr();
    EDITSLOT='';render();toast('Scoasă din rutină ✓ (permanent)');return;
  }
  if(!confirm('Anulezi această sarcină din ziua de azi?'))return;
  OVERRIDES[key]=Object.assign({},OVERRIDES[key],{sters:true});revine('ovr-'+key);saveOverrides();
  EDITSLOT='';render();toast('Sarcină anulată');
}
function salveazaSlot(key){
  const t=(document.getElementById('sl_text').value||'').trim();
  if(!t){alert('Scrie ce e de făcut.');return;}
  const dur=+(document.getElementById('sl_dur')||{}).value||30;
  if(isRutKey(key)){
    const i=pkInfo(key);
    ROVR[i.pk]=Object.assign({pers:i.pers,orig:i.orig},ROVR[i.pk],{t:t,dur:dur,sters:false});
    revine('rovr-'+i.pk);saveRovr();
    EDITSLOT='';render();toast('Rutină modificată ✓ (rămâne pentru toate zilele)');return;
  }
  OVERRIDES[key]=Object.assign({},OVERRIDES[key],{t:t,dur:dur,sters:false});
  revine('ovr-'+key);
  saveOverrides();EDITSLOT='';render();toast('Sarcină modificată ✓');
}
function slotEditor(t){
  const perm=isRutKey(t.key);
  return '<div class="card" style="border-color:var(--blue)"><div class="chead"><b>✏️ Modifică / înlocuiește sarcina</b>'
   +'<span class="sub">'+(perm?'modificarea rămâne în rutină, pentru toate zilele':'textul înlocuiește sarcina generată doar pentru ziua asta')+'</span></div>'
   +'<div class="frow"><input type="text" id="sl_text" value="'+esc(t.t)+'" placeholder="Ce e de făcut" style="flex:1;min-width:240px">'
   +'<label>Durata</label><select id="sl_dur">'+[10,15,20,30,45,60,90,120].map(d=>'<option value="'+d+'"'+((+t.dur||30)===d?' selected':'')+'>'+d+' min</option>').join('')+'</select>'
   +'<button class="btn primary" onclick="salveazaSlot(\''+t.key+'\')">Salvează</button>'
   +'<button class="btn small" onclick="EDITSLOT=\'\';render()">Renunț</button></div></div>';
}

/* ===== PLANIFICAREA ZILEI DE MÂINE (blocul de la finalul programului) ===== */
/* Fiecare, în ultimul sfert de oră, alege/scrie sarcinile urgente apoi importante
   pentru ziua lucrătoare următoare, la prima oră. Vineri → luni (sare weekendul). */
function randPlanMaine(t,p){
  const maine=t.maine||ziuaLucrUrm(ZI), b=BIFE[t.key], mine=(p===USER), sl=slug(p), rk={urg:0,imp:1};
  const q=EXTRA.filter(e=>!e.sters&&e.pers===p&&e.data===maine&&(prioExtra(e)==='urg'||prioExtra(e)==='imp'))
    .sort((a,b)=>rk[prioExtra(a)]-rk[prioExtra(b)]);
  let h='<div class="slot '+(b?'done':'')+'" style="border-left:4px solid var(--red-deep);background:var(--red-soft)"><div class="hh">'+hhmm(t.de)+'–'+hhmm(t.la)+'</div>'
   +'<input type="checkbox" '+(b?'checked':'')+' onchange="tick(\''+t.key+'\',this.checked,this)" title="Am planificat ziua de mâine">'
   +'<div class="bd"><b>⚡ Planifică mâine — '+fmtZi(maine)+'</b> <span class="mini">ce faci la prima oră: întâi urgent, apoi important</span>';
  if(q.length)h+=q.map(e=>'<div style="margin-top:4px">'+(prioExtra(e)==='urg'?'🔥':'⭐')+' '+esc(e.t)+(mine?' <a href="#" onclick="stergePlanMaine(\''+e.id+'\');return false" style="color:var(--red-deep);text-decoration:none" title="Scoate">✕</a>':'')+'</div>').join('');
  else h+='<div class="mini" style="margin-top:4px">Nimic pregătit pentru mâine încă.</div>';
  if(mine){
    const rank=e=>{const x=prioExtra(e);return x==='urg'?0:x==='imp'?1:2;};
    const azi=EXTRA.filter(e=>!e.sters&&e.pers===p&&e.data===ZI&&!BIFE['extra|'+e.id]).sort((a,b)=>rank(a)-rank(b));
    if(azi.length){
      h+='<div class="mini" style="margin-top:8px;font-weight:600">De azi, neterminate — mută pe mâine:</div>';
      h+=azi.map(e=>'<div style="margin-top:2px">'+(prioExtra(e)==='urg'?'🔥 ':prioExtra(e)==='imp'?'⭐ ':'• ')+esc(e.t)+' <a href="#" onclick="mutaPeMaine(\''+e.id+'\',\''+maine+'\');return false" style="color:var(--blue);text-decoration:none;font-weight:600" title="Mută pe mâine dimineață">→ mâine</a></div>').join('');
    }
  }
  if(mine)h+='<div class="frow" style="margin-top:6px;border:none;padding:0">'
   +'<input type="text" id="pm_'+sl+'" placeholder="Ce faci mâine la prima oră" style="flex:1;min-width:200px">'
   +'<select id="pmpr_'+sl+'"><option value="urg">🔥 urgentă</option><option value="imp">⭐ importantă</option></select>'
   +'<button class="btn small" onclick="adaugaPlanMaine(\''+sl+'\',\''+p+'\',\''+maine+'\')">➕ Pentru mâine</button></div>';
  h+='</div></div>';
  return h;
}
function adaugaPlanMaine(sl,pers,maine){
  const inp=document.getElementById('pm_'+sl), sel=document.getElementById('pmpr_'+sl);
  const t=((inp&&inp.value)||'').trim(); if(!t){alert('Scrie ce faci mâine la prima oră.');return;}
  const prio=((sel&&sel.value)||'urg');
  EXTRA.push({id:uid(),pers:pers,data:maine,t:t,dur:30,bloc:'d',prio:prio,urgent:prio==='urg',by:USER||pers,cand:todayIso(),mod_la:acum()});
  saveExtra();render();toast('Pregătit pentru mâine ✓');
}
function stergePlanMaine(id){const e=EXTRA.find(x=>x.id===id);if(e){e.sters=true;e.mod_la=acum();}saveExtra();render();toast('Șters');}
function mutaPeMaine(id,maine){const e=EXTRA.find(x=>x.id===id);if(e){e.data=maine;e.mod_la=acum();}saveExtra();render();toast('Mutat pe mâine ✓');}
/* Amână orice sarcină din zi pe ziua lucrătoare următoare. Ad-hoc: re-datează.
   Generată: anulează instanța de azi (override) + creează o copie ad-hoc pe mâine dimineață. */
function amanaSlot(key){
  const maine=ziuaLucrUrm(ZI);
  if(String(key).indexOf('extra|')===0){const e=EXTRA.find(x=>x.id===String(key).slice(6));if(e){e.data=maine;e.mod_la=acum();}saveExtra();render();toast('Amânat pe '+fmtZi(maine)+' ✓');return;}
  const t=sarciniZiBrut(ZI).find(x=>x.key===key);
  if(!t){toast('Nu s-a putut amâna');return;}
  OVERRIDES[key]=Object.assign({},OVERRIDES[key],{sters:true});revine('ovr-'+key);
  EXTRA.push({id:uid(),pers:t.pers,data:maine,t:t.t,dur:t.dur||30,bloc:'d',prio:t.prio||'',urgent:t.prio==='urg',by:USER||t.pers,cand:todayIso(),mod_la:acum(),amanata:true});
  saveOverrides();saveExtra();render();toast('Amânat pe '+fmtZi(maine)+' ✓');
}

function randRestante(){
  const r=restante();
  if(!r.length)return '<div class="empty">Nicio restanță. Totul bifat la zi. 👏</div>';
  const urg=t=>t.zile===7||/⚠️|🔥|urgen/i.test(t.t);
  const grup={};r.forEach(t=>{(grup[t.pers]=grup[t.pers]||[]).push(t);});
  let h='<div class="info">Aici apar doar restanțele din ziua lucrătoare anterioară — cele mai vechi de 48 de ore se șterg singure. Bifezi ce ai recuperat; cu ✕ elimini o sarcină care nu mai are rost.</div>';
  Object.keys(grup).forEach(p=>{
    const bl=grup[p].length>PRAG_RESTANTE;
    grup[p].sort((a,b)=>(urg(b)?1:0)-(urg(a)?1:0)||(a.iso<b.iso?-1:1));
    h+='<div class="card"><div class="chead"><b>'+esc(p)+'</b>'+(bl?'<span class="tag t7">blocat · mai sunt '+(grup[p].length-PRAG_RESTANTE)+' de recuperat</span>':'')+'<span class="right mini">'+grup[p].length+' restanțe</span></div>';
    grup[p].forEach(t=>h+='<div class="slot'+(urg(t)?' over':'')+'"><div class="hh">'+t.iso.slice(8)+'.'+t.iso.slice(5,7)+'</div>'
      +'<input type="checkbox" onchange="tick(\''+t.key+'\',this.checked,this)">'
      +'<div class="bd">'+(urg(t)?'<span class="tag t7">🔥 URGENT</span>':'')+'<span class="tag '+TIERS[t.zile].cls+'">'+esc(t.caz)+'</span>'+esc(t.t)+'</div>'
      +'<button class="btn small" onclick="elimRest(\''+t.key+'\')" title="Elimină restanța — nu se mai numără nici la realizate, nici la restanțe">✕</button></div>');
    h+='</div>';
  });
  return h;
}
function elimRest(key){
  if(!USER){alert('Alege-ți numele din dreapta sus.');return;}
  BIFE[key]={by:USER,at:new Date().toLocaleString('ro-RO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),eliminat:true,ts:acum()};
  revine('bifa-'+key);
  saveBife();render();toast('Restanță eliminată ✕');
}

function randFise(){
  const azi=dow(todayIso())>=1&&dow(todayIso())<=5?todayIso():addDays(todayIso(),8-dow(todayIso())||1);
  let h='<div class="info">Fișa se generează din motorul programului: tot ce apare aici ajunge automat în „Ziua mea", cu oră și bifă.</div>';
  ECHIPA.forEach(p=>{
    const zileSapt=[1,2,3,4,5].map(w=>{let d=todayIso();for(let i=0;i<7;i++){if(dow(addDays(d,i))===w)return addDays(d,i);}return d;});
    const set=new Map();
    zileSapt.forEach(iso=>rutina(iso).filter(t=>t.pers===p).forEach(t=>{
      const k=t.t.replace(/\s*\([^)]*\)\s*$/,'');
      set.set(k,(set.get(k)||new Set()).add(ZILE[dow(iso)]));
    }));
    h+='<div class="card"><div class="chead"><b>'+p+'</b><span class="sub">'+ROL[p]+'</span>'
      +'<span class="right"><button class="btn small" onclick="fisaWord(\''+p+'\')">📄 Word</button></span></div>';
    [...set.entries()].forEach(([t,zile])=>{
      const et=zile.size===5?'zilnic':[...zile].join(', ');
      h+='<div class="slot"><div class="hh">'+et+'</div><div class="bd">'+esc(t)+'</div></div>';
    });
    h+='<div class="freqhead">Pe caz</div>';
    const pc=planCaz({id:'x',nume:'—',zile:15,start:todayIso(),resp:p,gata:false});
    const uniq=new Set();
    Object.keys(pc).forEach(k=>pc[k].filter(t=>t.pers===p).forEach(t=>uniq.add(t.t)));
    if(!uniq.size)h+='<div class="slot"><div class="hh">·</div><div class="bd mini">Nicio sarcină specifică pe caz.</div></div>';
    [...uniq].forEach(t=>h+='<div class="slot"><div class="hh">·</div><div class="bd">'+esc(t)+'</div></div>');
    h+='</div>';
  });
  return h;
}
function fisaWord(p){
  let items=[];
  document.querySelectorAll('.card').forEach(c=>{const b=c.querySelector('.chead b');if(b&&b.textContent===p)c.querySelectorAll('.slot').forEach(s=>items.push(s.querySelector('.hh').textContent+' — '+s.querySelector('.bd').textContent));});
  const H='<html><head><meta charset="utf-8"></head><body style="font-family:Georgia,serif"><h1>Fișa postului — '+p+'</h1><h3>'+(ROL[p]||'')+'</h3><p>Program: 8:30–15:30 · 8:30–9:00 citit cărți · 12:00–12:30 pauză de masă</p><ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul><p style="color:#888;font-size:11px">Asociația „salvează o inimă" · generat '+new Date().toLocaleDateString('ro-RO')+'</p></body></html>';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+H],{type:'application/msword'}));
  a.download='fisa-postului-'+slug(p)+'.doc';a.click();
}
function salveazaProiect(){
  const data={aplicatie:'program-lucru-cazuri',versiune:3,salvatLa:new Date().toISOString(),salvatDe:USER||'',cazuri:CAZURI,bife:BIFE,praguri:PRAGURI,extra:EXTRA};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='proiect-cazuri-'+todayIso()+'.json';a.click();
  toast('Proiect salvat ✓');
}
function incarcaProiect(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!d.cazuri)throw 0;
      const cand=(d.salvatLa||'').slice(0,10), cine=d.salvatDe?' de '+d.salvatDe:'';
      if(!confirm('Încarci copia din '+cand+cine+'?\n\n'+d.cazuri.length+' cazuri, '+Object.keys(d.bife||{}).length+' bife.\n\nAceasta ÎNLOCUIEȘTE tot ce e acum în instrument, pentru toată echipa.'))return;
      CAZURI=d.cazuri||[];BIFE=d.bife||{};PRAGURI=d.praguri||{};
      if(Array.isArray(d.extra))EXTRA=d.extra;
      saveCaz();saveBife();savePrag();saveExtra();render();toast('Proiect încărcat ✓');
    }catch(e){alert('Fișierul nu e o copie validă a proiectului.');}
    input.value='';
  };
  r.readAsText(f);
}
function construiesteRaport(zile){
  const pana=todayIso(), de=addDays(pana,-(zile-1));
  const perPers={};
  ECHIPA.forEach(p=>perPers[p]={gata:0,tot:0,minGata:0,minTot:0,taiat:0,lista:[]});
  for(let i=0;i<zile;i++){
    const iso=addDays(de,i);
    sarciniZi(iso).filter(t=>t.pers!=='Familia').forEach(t=>{
      if(!perPers[t.pers])perPers[t.pers]={gata:0,tot:0,minGata:0,minTot:0,taiat:0,lista:[]};
      const min=+t.dur||0;
      perPers[t.pers].tot++;perPers[t.pers].minTot+=min;
      const b=BIFE[t.key];
      if(b&&!b.eliminat){perPers[t.pers].gata++;perPers[t.pers].minGata+=min;perPers[t.pers].lista.push({iso,t:t.t,caz:t.caz,dur:min});}
    });
    /* munca generată care n-a încăput în ziua de 5h = presiune peste program */
    alegePentruZi(iso).taiate.forEach(t=>{if(perPers[t.pers])perPers[t.pers].taiat+=(+t.dur||0);});
  }
  const fam={gata:0,tot:0};
  for(let i=0;i<zile;i++)sarciniZi(addDays(de,i)).filter(t=>t.pers==='Familia').forEach(t=>{fam.tot++;if(BIFE[t.key])fam.gata++;});
  const pct=(a,b)=>b?Math.round(a/b*100):0, ore=m=>(Math.round(m/60*10)/10)+'h';
  let H='<html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial,sans-serif">'
   +'<h1 style="font-family:Georgia,serif;color:#9E1F27">Raport de activitate &middot; Asocia&#539;ia „salveaz&#259; o inim&#259;"</h1>'
   +'<p><b>Perioada:</b> '+de+' – '+pana+' ('+zile+(zile===1?' zi':' zile')+')<br><b>Generat:</b> '+new Date().toLocaleString('ro-RO')+(USER?' de '+USER:'')+'</p>'
   +'<h2>Sinteză</h2>'
   +'<p style="font-size:12px;color:#555">Procentul e pe <b>efort (minute)</b>, nu pe număr de sarcini. „Peste program" = munca generată care n-a încăput în ziua de 5h și a devenit restanță — cu cât e mai mare, cu atât persoana e mai suprasolicitată.</p>'
   +'<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:12px">'
   +'<tr style="background:#F7E5E4"><th>Persoană</th><th>Realizate</th><th>Din total</th><th>Ore realizate</th><th>Ore planificate</th><th>Peste program</th><th>Procent efort</th></tr>';
  ECHIPA.forEach(p=>{const d=perPers[p];H+='<tr><td>'+p+'</td><td>'+d.gata+'</td><td>'+d.tot+'</td><td>'+ore(d.minGata)+'</td><td>'+ore(d.minTot)+'</td><td>'+(d.taiat?'<b style="color:#9E1F27">'+ore(d.taiat)+'</b>':'—')+'</td><td>'+pct(d.minGata,d.minTot)+'%</td></tr>';});
  H+='<tr style="background:#E4EEF2"><td>Familiile</td><td>'+fam.gata+'</td><td>'+fam.tot+'</td><td>—</td><td>—</td><td>—</td><td>'+pct(fam.gata,fam.tot)+'%</td></tr></table>';
  H+='<h2>Cazuri</h2><table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:12px">'
   +'<tr style="background:#F7E5E4"><th>Caz</th><th>Responsabil</th><th>Termen</th><th>Strâns</th><th>Țintă</th><th>Progres</th><th>Stare</th></tr>';
  CAZURI.filter(c=>!c.sters).forEach(cz=>{H+='<tr><td>'+esc(cz.nume)+'</td><td>'+esc(cz.resp)+'</td><td>'+cz.zile+' zile</td><td>'+eur(cz.strans||0)+'</td><td>'+eur(cz.tinta||0)+'</td><td>'+procCaz(cz)+'%</td><td>'+(cz.gata?'încheiat':'în lucru')+'</td></tr>';});
  H+='</table><h2>Ce s-a realizat, pe persoane</h2>';
  ECHIPA.forEach(p=>{
    const d=perPers[p];H+='<h3>'+p+' — '+d.gata+' sarcini · '+ore(d.minGata)+' din '+ore(d.minTot)+' realizate</h3><ul style="font-size:12px">';
    if(!d.lista.length)H+='<li>Nicio sarcină bifată în această perioadă.</li>';
    d.lista.forEach(x=>H+='<li>'+x.iso+' — '+esc(x.t)+' <span style="color:#888">· '+x.dur+' min</span>'+(x.caz?' <i>('+esc(x.caz)+')</i>':'')+'</li>');
    H+='</ul>';
  });
  H+='<p style="color:#888;font-size:11px;margin-top:26px">Generat automat din planificatorul de cazuri.</p></body></html>';
  return H;
}
function perioadaRaport(){
  const z=prompt('Raport pentru ce perioadă?\n\n1 = ziua de azi\n7 = ultima săptămână\n30 = ultima lună','7');
  if(!z)return null;
  return Math.max(1,Math.min(62,+z||7));
}
function numeRaport(zile,ext){return 'raport-'+(zile===1?'zilnic':zile<=7?'saptamanal':'lunar')+'-'+todayIso()+'.'+ext;}
function raportPdf(){
  const zile=perioadaRaport(); if(!zile)return;
  if(typeof html2pdf!=='function'){toast('PDF încă se încarcă — mai încearcă în câteva secunde');return;}
  const H=construiesteRaport(zile);
  const parsed=new DOMParser().parseFromString(H,'text/html');
  const cont=document.createElement('div');
  cont.style.cssText='font-family:Calibri,Arial,sans-serif;width:760px;padding:24px;color:#111;background:#fff';
  cont.innerHTML=parsed.body.innerHTML;
  document.body.appendChild(cont);
  toast('Se generează PDF-ul…');
  html2pdf().set({margin:[10,10,12,10],filename:numeRaport(zile,'pdf'),
    image:{type:'jpeg',quality:.96},
    html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
    pagebreak:{mode:['css','legacy'],avoid:'tr'}})
    .from(cont).save().then(function(){cont.remove();toast('PDF descărcat ✓');})
    .catch(function(){cont.remove();toast('Nu s-a putut genera PDF-ul');});
}
function raportWord(){
  const zile=perioadaRaport(); if(!zile)return;
  const H=construiesteRaport(zile);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+H],{type:'application/msword'}));
  a.download='raport-'+(zile===1?'zilnic':zile<=7?'saptamanal':'lunar')+'-'+todayIso()+'.doc';a.click();
  toast('Raport descărcat ✓');
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',1700);}
loadAll();
</script>

<script>
(function(){
  function norm(s){
    return (s||'').toString().trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[\u0219\u015f\u0163\u0165]/g,function(c){return c==='\u0163'||c==='\u0165'?'t':'s';})
      .replace(/\u021b/g,'t');
  }
  function firstToken(s){ return norm(s).split(/[\s@._-]+/)[0]||''; }
  function mapName(login){
    if(!login) return '';
    var nl=norm(login), fl=firstToken(login);
    for(var i=0;i<TOTI.length;i++){
      var p=TOTI[i], np=norm(p);
      if(np===nl||np===fl||firstToken(p)===fl) return p;
    }
    return '';
  }
  function apply(){
    var login=''; try{ login=localStorage.getItem('soi-plan2-loginname')||''; }catch(e){}
    var m=mapName(login);
    if(!m) return;
    try{ localStorage.setItem('soi-plan2-user',m); }catch(e){}
    if(typeof setUser==='function' && typeof USER!=='undefined' && USER!==m) setUser(m);
    var who=document.getElementById('whoami');
    if(who){
      var box=who.closest('.userbox');
      if(box) box.innerHTML='Ești logat: <b>'+m+'</b>';
    }
  }
  try{ apply(); }catch(e){}
  setTimeout(function(){ try{ apply(); }catch(e){} }, 500);
})();
</script>
